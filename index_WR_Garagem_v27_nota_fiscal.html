8px}.printMeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}.printMeta div{padding:7px;border-bottom:1px solid #ddd}.printAreaTotal{text-align:right;font-size:18px;font-weight:800;margin-top:15px;color:#111}.printSection p{color:#111;line-height:1.45;margin:6px 0}.printHeader h1{color:#111}.printHeader small{color:#333!important}}

<div id="loginModal" class="modal hidden"><div class="modalbox"><h2>Entrar no WR Garagem</h2><div class="notice">Primeiro configure a conexão com o seu projeto Supabase. Use somente a <b>Publishable Key</b>; nunca use a Secret/service_role key.</div><div class="field"><label>Project URL</label><input id="cfgUrl" placeholder="https://seu-projeto.supabase.co"></div><div class="field"><label>Publishable Key</label><input id="cfgKey" type="password" placeholder="sb_publishable_..."></div><div class="field"><label>E-mail</label><input id="loginEmail" type="email"></div><div class="field"><label>Senha</label><input id="loginPassword" type="password"></div><button class="primary" id="loginBtn">Entrar</button><p id="loginMsg" class="muted"></p></div></div>

<script id="wr-fiscal-functions">
function fiscalKey(id){return 'wr_garagem_nf_'+id}
function getFiscal(id){
  try{
    return JSON.parse(localStorage.getItem(fiscalKey(id))||'null') ||
      {status:'Pendente',tipo:'NFS-e + NFC-e',numero:'',chave:'',link:''}
  }catch(e){
    return {status:'Pendente',tipo:'NFS-e + NFC-e',numero:'',chave:'',link:''}
  }
}
function saveFiscal(id,p){localStorage.setItem(fiscalKey(id),JSON.stringify({...getFiscal(id),...p}))}
function fiscalPrepare(id){
  alert('OS preparada para emissão fiscal. A emissão oficial será conectada ao provedor/API fiscal da oficina.')
}
function fiscalUpdate(id){
  let f=getFiscal(id)
  let status=prompt('Status fiscal (Pendente, Emitida ou Cancelada):',f.status)
  if(status===null)return
  let tipo=prompt('Tipo de documento (NFS-e, NFC-e ou NF-e):',f.tipo)
  if(tipo===null)return
  let numero=prompt('Número da nota:',f.numero)
  if(numero===null)numero=''
  let chave=prompt('Chave de acesso:',f.chave)
  if(chave===null)chave=''
  let link=prompt('Link de consulta:',f.link)
  if(link===null)link=''
  saveFiscal(id,{status,tipo,numero,chave,link})
  viewOS(id)
}
function fiscalWhatsApp(id){
  let o=data.ordens.find(x=>x.id===id)
  if(!o)return
  let c=data.clientes.find(x=>x.id===o.cliente_id)
  let phone=String(c?.telefone||'').replace(/\D/g,'')
  if(!phone)return alert('Este cliente não possui telefone cadastrado.')
  if(phone.length<=11)phone='55'+phone
  let f=getFiscal(id)
  let msg=`Olá, ${c?.nome||''}!\n\nWR GARAGEM\nOrdem de Serviço ${osLabel(o.numero)}\n\nNota fiscal: ${f.status}${f.numero?'\nNúmero: '+f.numero:''}${f.link?'\nConsulta: '+f.link:''}\n\nValor total: ${money(o.total||0)}`
  window.location.href='https://wa.me/'+phone+'?text='+encodeURIComponent(msg)
}
function renderFiscalCard(o,itens){
  let f=getFiscal(o.id)
  let serv=(itens||[]).filter(x=>x.tipo==='Serviço').reduce((a,x)=>a+Number(x.qtd||0)*Number(x.valor||0),0)
  let pec=(itens||[]).filter(x=>x.tipo==='Peça').reduce((a,x)=>a+Number(x.qtd||0)*Number(x.valor||0),0)
  return `<div class="fiscalCard">
    <div class="fiscalHead">
      <div><h3 style="margin:0">🧾 Nota Fiscal</h3><div class="muted">Controle fiscal desta Ordem de Serviço</div></div>
      <span class="fiscalBadge">${esc(f.status)}</span>
    </div>
    <div class="fiscalGrid">
      <div class="fiscalBox"><small>Tipo</small><b>${esc(f.tipo)}</b></div>
      <div class="fiscalBox"><small>Cliente / CPF-CNPJ</small><b>${esc(o.clientes?.nome||'')} — ${esc(o.clientes?.cpf_cnpj||'Não informado')}</b></div>
      <div class="fiscalBox"><small>Serviços</small><b>${money(serv)}</b></div>
      <div class="fiscalBox"><small>Peças</small><b>${money(pec)}</b></div>
      <div class="fiscalBox"><small>Total da OS</small><b>${money(o.total||0)}</b></div>
      <div class="fiscalBox"><small>Número / Chave</small><b>${esc(f.numero||'—')}${f.chave?' / '+esc(f.chave):''}</b></div>
    </div>
    <div class="fiscalActions">
      <button class="primary" onclick="fiscalPrepare('${o.id}')">🧾 Preparar emissão</button>
      <button class="secondary" onclick="fiscalUpdate('${o.id}')">✏️ Atualizar dados fiscais</button>
      <button class="ghost" onclick="fiscalWhatsApp('${o.id}')">📱 Enviar pelo WhatsApp</button>
    </div>
  </div>`
}
</script>

<script>
const CONFIG_KEY='wr_garagem_supabase_config_v1';
let sb=null, session=null, oficina=null, data={clientes:[],veiculos:[],pecas:[],servicos:[],ordens:[],movimentacoes_estoque:[]};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const osLabel=n=>'OS-'+String(Number(n)||0).padStart(5,'0');
const toast=(m)=>{$('toast').textContent=m;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)};
$('today').textContent=new Date().toLocaleDateString('pt-BR');
function getCfg(){try{return JSON.parse(localStorage.getItem(CONFIG_KEY)||'null')}catch{return null}}
function setCfg(c){localStorage.setItem(CONFIG_KEY,JSON.stringify(c))}
async function init(){let c=getCfg();if(c?.url&&c?.key){connect(c.url,c.key)}else showLogin('');}
function connect(url,key){sb=window.supabase.createClient(url.trim(),key.trim());sb.auth.onAuthStateChange((_e,s)=>{session=s;if(s){$('loginModal').classList.add('hidden');$('userEmail').textContent=s.user.email||'';loadAll()}else showLogin('')});}
function showLogin(msg){$('loginModal').classList.remove('hidden');if(msg)$('loginMsg').textContent=msg;let c=getCfg();if(c){$('cfgUrl').value=c.url;$('cfgKey').value=c.key}}
$('loginBtn').onclick=async()=>{let url=$('cfgUrl').value.trim(),key=$('cfgKey').value.trim(),email=$('loginEmail').value.trim(),password=$('loginPassword').value;if(!url||!key||!email||!password){$('loginMsg').textContent='Preencha URL, Publishable Key, e-mail e senha.';return}setCfg({url,key});connect(url,key);$('loginMsg').textContent='Entrando...';let {error}=await sb.auth.signInWithPassword({email,password});if(error)$('loginMsg').textContent=error.message};
$('logoutBtn').onclick=async()=>{if(sb)await sb.auth.signOut()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));
function page(p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({dashboard,os,clientes,veiculos,pecas,estoque,financeiro,servicos,historico}[p])()}
async function loadAll(){try{if(!session?.user?.id)throw new Error('Sessão do usuário não encontrada.');let m=await sb.from('oficina_usuarios').select('oficina_id').eq('user_id',session.user.id).limit(1).maybeSingle();if(m.error)throw m.error;if(!m.data?.oficina_id){toast('Usuário sem oficina vinculada.');return}let o=await sb.from('oficinas').select('*').eq('id',m.data.oficina_id).single();if(o.error)throw o.error;if(!o.data){toast('Oficina não encontrada.');return}oficina=o.data;let tables=['clientes','veiculos','pecas','servicos','ordens_servico','movimentacoes_estoque'];let out=await Promise.all(tables.map(t=>sb.from(t).select('*').eq('oficina_id',oficina.id)));for(let i=0;i<out.length;i++){if(out[i].error)throw out[i].error}data.clientes=out[0].data||[];data.veiculos=out[1].data||[];data.pecas=out[2].data||[];data.servicos=out[3].data||[];data.ordens=out[4].data||[];data.movimentacoes_estoque=out[5].data||[];page('dashboard')}catch(e){console.error(e);toast('Erro ao carregar dados: '+e.message)}}
async function refresh(t){let {data:d,error}=await sb.from(t).select('*').eq('oficina_id',oficina.id);if(error)throw error;return d||[]}
function dashboard(){let abertas=data.ordens.filter(x=>!['Concluída','Entregue','Cancelada'].includes(x.status)).length,total=data.ordens.reduce((s,x)=>s+Number(x.total||0),0),recebido=data.ordens.reduce((s,x)=>s+Number(x.valor_pago||0),0),aReceber=Math.max(0,total-recebido);$('app').innerHTML=`<h2>Dashboard</h2><div class="grid"><div class="card">OS em aberto<b>${abertas}</b></div><div class="card">Clientes<b>${data.clientes.length}</b></div><div class="card">Veículos<b>${data.veiculos.length}</b></div><div class="card">Faturamento OS<b>${money(total)}</b></div><div class="card">A receber<b>${money(aReceber)}</b></div></div><div class="panel" style="margin-top:16px"><h3>Últimas ordens de serviço</h3>${data.ordens.length?`<div class="tablewrap"><table><tr><th>OS</th><th>Cliente</th><th>Placa</th><th>Status</th><th>Total</th></tr>${data.ordens.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,8).map(o=>`<tr><td>${esc(osLabel(o.numero))}</td><td>${esc(data.clientes.find(c=>c.id===o.cliente_id)?.nome||'')}</td><td>${esc(data.veiculos.find(v=>v.id===o.veiculo_id)?.placa||'')}</td><td><span class="status">${esc(o.status)}</span></td><td>${money(o.total)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma OS cadastrada ainda.</div>'}</div>`}
async function addSimple(table,obj){obj.oficina_id=oficina.id;let {error}=await sb.from(table).insert(obj);if(error)throw error;data[table==='clientes'?'clientes':table==='veiculos'?'veiculos':table==='pecas'?'pecas':'servicos']=await refresh(table);toast('Cadastro salvo!')}
function clientes(){ $('app').innerHTML=`<h2>Clientes</h2><div class="panel"><div class="row"><div class="field"><label>Nome / Razão Social</label><input id="cn"></div><div class="field"><label>CPF/CNPJ</label><input id="cd"></div><div class="field"><label>Telefone</label><input id="ct"></div><div class="field"><label>E-mail</label><input id="ce"></div><div class="field"><label>Endereço</label><input id="cend"></div></div><button class="primary" id="addCliente">Cadastrar cliente</button></div><div class="panel" style="margin-top:16px"><div class="tablewrap"><table><tr><th>Nome</th><th>CPF/CNPJ</th><th>Telefone</th><th></th></tr>${data.clientes.map(c=>`<tr><td>${esc(c.nome)}</td><td>${esc(c.cpf_cnpj)}</td><td>${esc(c.telefone)}</td><td><button class="danger" onclick="delRow('clientes','${c.id}')">Excluir</button></td></tr>`).join('')}</table></div></div>`;$('addCliente').onclick=async()=>{if(!$('cn').value.trim())return alert('Informe o nome.');try{await addSimple('clientes',{nome:$('cn').value.trim(),cpf_cnpj:$('cd').value,telefone:$('ct').value,email:$('ce').value,endereco:$('cend').value,observacoes:null});clientes()}catch(e){toast('Erro: '+e.message)}}}

trol"><label class="secondary" style="display:inline-block;padding:10px 14px;cursor:pointer">📷 Adicionar fotos<input id="osPhotoInput" class="photoInput" type="file" accept="image/*" multiple onchange="addOSPhotos('${o.id}',this.files)"></label></div></div><div id="photoGrid" class="photoGrid"></div></div>`;let fp=$('fiscalPanel');if(fp)fp.innerHTML=renderFiscalCard(o,itens);await renderPhotos(o.id)}
function photoKey(id){return 'wr_garagem_os_photos_'+id}
function getLocalPhotos(id){try{return JSON.parse(localStorage.getItem(photoKey(id))||'[]')}catch{return []}}
function saveLocalPhotos(id,arr){localStorage.setItem(photoKey(id),JSON.stringify(arr))}
async function loadCloudPhotos(id){try{let q=await sb.from('fotos_os').select('id,os_id,arquivo_url,descricao,storage_path,created_at').eq('os_id',id).order('created_at',{ascending:false});if(q.error)throw q.error;return q.data||[]}catch(e){console.warn('Erro ao carregar fotos da OS:',e);return []}}
async function renderPhotos(id){let cloud=await loadCloudPhotos(id);let local=getLocalPhotos(id);let g=$('photoGrid');if(!g)return;g.innerHTML=(cloud.length||local.length)?cloud.map(x=>`<div class="photoCard"><img src="${esc(x.arquivo_url)}" alt="Foto da OS"><div class="photoMeta">${esc(x.descricao||'Foto da OS')}</div><div class="photoActions"><button class="danger" onclick="deleteCloudPhoto('${id}','${x.id}','${esc(x.storage_path||'')}')">Excluir</button></div></div>`).join('')+local.map((x,i)=>`<div class="photoCard"><img src="${x.data}" alt="Foto da OS"><div class="photoMeta">${esc(x.desc||'Foto da OS')} <span class="muted">(nesta sessão)</span></div><div class="photoActions"><button class="danger" onclick="deleteOSPhoto('${id}',${i})">Excluir</button></div></div>`).join(''):'<div class="muted">Nenhuma foto adicionada ainda.</div>'}
function compressPhoto(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let max=1400,w=im.width,h=im.height;if(w>max||h>max){let k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k)}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);c.toBlob(b=>resolve(b),'image/jpeg',.72)};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function addOSPhotos(id,files){if(!files?.length)return;let ok=0,fail=[];for(const f of Array.from(files)){try{let blob=await compressPhoto(f),name=Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg',path=id+'/'+name;let up=await sb.storage.from('os-fotos').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(up.error)throw up.error;let pub=sb.storage.from('os-fotos').getPublicUrl(path);if(!pub?.data?.publicUrl)throw new Error('Não foi possível gerar o endereço público da foto.');let desc=prompt('Descrição da foto (opcional):','Foto da OS')||'Foto da OS';let ins=await sb.from('fotos_os').insert({os_id:id,arquivo_url:pub.data.publicUrl,descricao:desc,storage_path:path});if(ins.error)throw ins.error;ok++}catch(e){console.error('Falha ao salvar foto:',e);fail.push(f.name+': '+(e.message||'erro desconhecido'))}}if(ok)toast(ok+' foto(s) salva(s) na nuvem.');if(fail.length)alert('Não foi possível salvar '+fail.length+' foto(s) na nuvem.\n\n'+fail.join('\n'));await renderPhotos(id)}
async function deleteCloudPhoto(id,pid,path){if(!confirm('Excluir esta foto?'))return;if(path)await sb.storage.from('os-fotos').remove([path]);let r=await sb.from('fotos_os').delete().eq('id',pid);if(r.error)toast('Erro ao excluir: '+r.error.message);await renderPhotos(id)}
function deleteOSPhoto(id,i){let arr=getLocalPhotos(id);if(!confirm('Excluir esta foto?'))return;arr.splice(i,1);saveLocalPhotos(id,arr);renderPhotos(id)}

async function shareClientOS(id){try{let q=await sb.from('ordens_servico').select('id,numero,public_token,clientes(nome,telefone)').eq('id',id).single();if(q.error)throw q.error;let o=q.data;let token=o.public_token;if(!token){if(window.crypto?.randomUUID)token=crypto.randomUUID().replace(/-/g,'');else{let a=new Uint8Array(24);crypto.getRandomValues(a);token=Array.from(a,b=>b.toString(16).padStart(2,'0')).join('')}let u=await sb.from('ordens_servico').update({public_token:token}).eq('id',id).eq('oficina_id',oficina.id);if(u.error)throw u.error}let cfg=getCfg();if(!cfg?.key)return alert('A Publishable Key não está configurada neste aparelho.');let link=location.origin+'/?cliente='+encodeURIComponent(token)+'&k='+encodeURIComponent(cfg.key);let phone=String(o.clientes?.telefone||'').replace(/\D/g,'');if(phone.length<=11&&phone)phone='55'+phone;let msg='Olá! Aqui está o link para acompanhar sua Ordem de Serviço da WR Garagem: '+link;if(navigator.clipboard)try{await navigator.clipboard.writeText(link)}catch{}if(phone){window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank')}else alert('Link criado e copiado: '+link)}catch(e){alert('Não foi possível gerar o link: '+e.message)}}

async function publicApprove(){
  if(!confirm('Confirmar aprovação deste orçamento?'))return;
  await publicDecision('aprovar','');
}
function publicReject(){
  let b=$('rejectBox'); if(b)b.style.display='block';
}
async function confirmPublicReject(){
  await publicDecision('recusar',$('rejectReason')?.value||'');
}
async function publicDecision(action,reason){
  try{
    let token=window.publicOSToken||new URLSearchParams(location.search).get('cliente');
    let r=await sb.rpc('respond_public_os',{p_token:token,p_action:action,p_reason:reason});
    if(r.error)throw r.error;
    let o=r.data;
    if(!o)return alert('Não foi possível registrar a decisão.');
    renderPublicOS(o);
    alert(action==='aprovar'?'Orçamento aprovado com sucesso! A oficina já foi avisada.':'Orçamento recusado. A oficina já foi avisada.');
  }catch(e){alert('Não foi possível registrar a decisão: '+e.message)}
}
