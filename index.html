<header><div class="brand"><div class="logo">WR</div><div><h1>WR Garagem</h1><small id="today"></small></div></div><div class="userbar"><span id="userEmail" class="muted"></span><button class="ghost noPrint" id="logoutBtn">Sair</button></div></header>

</nav><main id="app"></main></div>
<div id="loginModal" class="modal hidden"><div class="modalbox"><h2>Entrar no WR Garagem</h2><div class="notice">Primeiro configure a conexão com o seu projeto Supabase. Use somente a <b>Publishable Key</b>; nunca use a Secret/service_role key.</div><div class="field"><label>Project URL</label><input id="cfgUrl" placeholder="https://seu-projeto.supabase.co"></div><div class="field"><label>Publishable Key</label><input id="cfgKey" type="password" placeholder="sb_publishable_..."></div><div class="field"><label>E-mail</label><input id="loginEmail" type="email"></div><div class="field"><label>Senha</label><input id="loginPassword" type="password"></div><button class="primary" id="loginBtn">Entrar</button><p id="loginMsg" class="muted"></p></div></div>
<div id="toast" class="toast hidden"></div>
<script>
function ensurePublicPhotos(data){try{if(typeof renderPublicPhotos==='function')renderPublicPhotos(data&&data.fotos||[])}catch(e){console.warn(e)}}
const CONFIG_KEY='wr_garagem_supabase_config_v1';
let sb=null, session=null, oficina=null, data={clientes:[],veiculos:[],pecas:[],servicos:[],ordens:[]};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const numInput=v=>{let s=String(v??'').trim().replace(/\s/g,'');if(!s)return 0;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else if(s.includes(','))s=s.replace(',','.');let n=Number(s);return Number.isFinite(n)?n:0};
const osLabel=n=>'OS-'+String(Number(n)||0).padStart(5,'0');
const toast=(m)=>{$('toast').textContent=m;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)};
$('today').textContent=new Date().toLocaleDateString('pt-BR');
function getCfg(){try{return JSON.parse(localStorage.getItem(CONFIG_KEY)||'null')}catch{return null}}
function setCfg(c){localStorage.setItem(CONFIG_KEY,JSON.stringify(c))}
let initPromise=null;
async function init(){if(initPromise)return initPromise;initPromise=(async()=>{try{let c=getCfg();if(c?.url&&c?.key){await connect(c.url,c.key)}else showLogin('')}catch(e){console.error(e);showLogin('Não foi possível inicializar a conexão: '+(e?.message||e))}})();return initPromise}
async function connect(url,key){if(!window.supabase?.createClient)throw new Error('Biblioteca do Supabase não carregou. Recarregue a página.');sb=window.supabase.createClient(url.trim(),key.trim());const r=await sb.auth.getSession();session=r.data?.session||null;if(session){$('loginModal').classList.add('hidden');$('userEmail').textContent=session.user?.email||'';await loadAll(false)}else showLogin('')}
async function ensureConnection(){if(sb&&session?.user?.id&&oficina)return true;let c=getCfg();if(!c?.url||!c?.key){showLogin('Configure a conexão com o Supabase neste aparelho.');return false}try{if(!sb){if(!window.supabase?.createClient)throw new Error('Biblioteca do Supabase não carregou.');sb=window.supabase.createClient(c.url.trim(),c.key.trim())}let r=await sb.auth.getSession();session=r.data?.session||null;if(!session){showLogin('Sessão expirada. Entre novamente.');return false}$('loginModal').classList.add('hidden');$('userEmail').textContent=session.user?.email||'';if(!oficina)await loadAll(false);return !!oficina}catch(e){console.error(e);toast('Erro de conexão: '+(e?.message||e));return false}}
function showLogin(msg){$('loginModal').classList.remove('hidden');if(msg)$('loginMsg').textContent=msg;let c=getCfg();if(c){$('cfgUrl').value=c.url;$('cfgKey').value=c.key}}
$('loginBtn').onclick=async()=>{let url=$('cfgUrl').value.trim(),key=$('cfgKey').value.trim(),email=$('loginEmail').value.trim(),password=$('loginPassword').value;if(!url||!key||!email||!password){$('loginMsg').textContent='Preencha URL, Publishable Key, e-mail e senha.';return}try{setCfg({url,key});$('loginMsg').textContent='Conectando...';await connect(url,key);let {data:r,error}=await sb.auth.signInWithPassword({email,password});if(error){$('loginMsg').textContent=error.message;return}session=r?.session||null;if(session){$('loginModal').classList.add('hidden');$('userEmail').textContent=session.user?.email||'';await loadAll(false);page('dashboard')}}catch(e){console.error(e);$('loginMsg').textContent=e?.message||String(e)}};
$('logoutBtn').onclick=async()=>{if(sb)await sb.auth.signOut()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));
async function page(p){try{if(!(await ensureConnection()))return;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let fn={dashboard,os,clientes,veiculos,pecas,financeiro,servicos,historico,whatsapp}[p];if(typeof fn==='function')await fn()}catch(e){console.error(e);toast('Erro ao abrir '+p+': '+(e?.message||String(e)))}}
async function loadAll(goDashboard=true){try{if(!sb)throw new Error('Conexão com o banco não inicializada.');if(!session?.user?.id)throw new Error('Sessão do usuário não encontrada.');let m=await sb.from('oficina_usuarios').select('oficina_id').eq('user_id',session.user.id).limit(1).maybeSingle();if(m.error)throw m.error;if(!m.data?.oficina_id){toast('Usuário sem oficina vinculada.');return}let o=await sb.from('oficinas').select('*').eq('id',m.data.oficina_id).single();if(o.error)throw o.error;if(!o.data){toast('Oficina não encontrada.');return}oficina=o.data;let tables=['clientes','veiculos','pecas','servicos','ordens_servico'];let out=await Promise.all(tables.map(t=>sb.from(t).select('*').eq('oficina_id',oficina.id)));for(let i=0;i<out.length;i++){if(out[i].error)throw out[i].error}data.clientes=out[0].data||[];data.veiculos=out[1].data||[];data.pecas=out[2].data||[];data.servicos=out[3].data||[];data.ordens=out[4].data||[];if(goDashboard)dashboard()}catch(e){console.error(e);toast('Erro ao carregar dados: '+e.message)}}
async function refresh(t){let {data:d,error}=await sb.from(t).select('*').eq('oficina_id',oficina.id);if(error)throw error;return d||[]}
function dashboard(){
  const now=new Date();
  const month=now.getMonth(), year=now.getFullYear();
  const abertas=data.ordens.filter(x=>!['Concluída','Entregue','Cancelada'].includes(x.status)).length;
  const aguardando=data.ordens.filter(x=>x.status==='Aguardando aprovação').length;
  const execucao=data.ordens.filter(x=>x.status==='Em execução').length;
  const aguardandoPeca=data.ordens.filter(x=>x.status==='Aguardando peça').length;
  const monthOrders=data.ordens.filter(x=>{const d=new Date(x.created_at||0);return d.getMonth()===month&&d.getFullYear()===year});
  const faturamentoMes=monthOrders.reduce((s,x)=>s+Number(x.total||0),0);
  const recebidoMes=monthOrders.reduce((s,x)=>s+Number(x.valor_pago||0),0);
  const totalRecebido=data.ordens.reduce((s,x)=>s+Number(x.valor_pago||0),0);
  const totalFaturado=data.ordens.reduce((s,x)=>s+Number(x.total||0),0);
  const aReceber=Math.max(0,totalFaturado-totalRecebido);
  const vencidas=data.ordens.filter(o=>o.vencimento&&new Date(o.vencimento+'T23:59:59')<now&&Number(o.total||0)>Number(o.valor_pago||0)&&o.status!=='Cancelada').length;
  const entregaHoje=data.ordens.filter(o=>o.previsao_entrega&&o.previsao_entrega===now.toISOString().slice(0,10)&&!['Entregue','Cancelada','Concluída'].includes(o.status)).length;
  const attention=[];
  data.ordens.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).forEach(o=>{
    const c=data.clientes.find(x=>x.id===o.cliente_id),v=data.veiculos.find(x=>x.id===o.veiculo_id);
    if(o.status==='Aguardando aprovação') attention.push({kind:'warn',badge:'Aguardando',title:osLabel(o.numero)+' • '+(c?.nome||''),sub:[v?.modelo,v?.placa].filter(Boolean).join(' — ')+' • '+money(o.total),id:o.id});
    else if(o.status==='Aguardando peça') attention.push({kind:'danger',badge:'Aguardando peça',title:osLabel(o.numero)+' • '+(c?.nome||''),sub:[v?.modelo,v?.placa].filter(Boolean).join(' — '),id:o.id});
    else if(o.previsao_entrega&&o.previsao_entrega===now.toISOString().slice(0,10)&&!['Entregue','Cancelada','Concluída'].includes(o.status)) attention.push({kind:'warn',badge:'Entrega hoje',title:osLabel(o.numero)+' • '+(c?.nome||''),sub:[v?.modelo,v?.placa].filter(Boolean).join(' — '),id:o.id});
    else if(o.vencimento&&new Date(o.vencimento+'T23:59:59')<now&&Number(o.total||0)>Number(o.valor_pago||0)&&o.status!=='Cancelada') attention.push({kind:'danger',badge:'Pagamento vencido',title:osLabel(o.numero)+' • '+(c?.nome||''),sub:'Saldo: '+money(Math.max(0,Number(o.total||0)-Number(o.valor_pago||0))),id:o.id});
  });
  const recent=data.ordens.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,8);
  const mesNome=now.toLocaleDateString('pt-BR',{month:'long'});
  $('app').innerHTML=`
    <div class="dashboardHero"><div><h2>Bom dia! 👋</h2><p>Painel da WR Garagem • ${mesNome.charAt(0).toUpperCase()+mesNome.slice(1)} de ${year}</p></div><div class="dashboardActions"><button class="primary" onclick="page('os')">＋ Nova OS</button><button class="secondary" onclick="page('clientes')">＋ Cliente</button></div></div>
    <div class="dashboardGroupLabel">OPERAÇÃO</div><div class="kpiGrid">
      <div class="kpi"><div class="kpiIcon">🔧</div><div class="kpiLabel">OS em aberto</div><div class="kpiValue">${abertas}</div><div class="kpiHint">Em atendimento</div></div>
      <div class="kpi"><div class="kpiIcon">⏳</div><div class="kpiLabel">Aguardando aprovação</div><div class="kpiValue">${aguardando}</div><div class="kpiHint">Precisam de retorno</div></div>
      <div class="kpi"><div class="kpiIcon">🚗</div><div class="kpiLabel">Em execução</div><div class="kpiValue">${execucao}</div><div class="kpiHint">Serviços em andamento</div></div>
      <div class="kpi"><div class="kpiIcon">⚠️</div><div class="kpiLabel">Aguardando peça</div><div class="kpiValue">${aguardandoPeca}</div><div class="kpiHint">Dependem de compra</div></div></div><div class="dashboardGroupLabel finance">FINANCEIRO</div><div class="kpiGrid">
      <div class="kpi"><div class="kpiIcon">💰</div><div class="kpiLabel">Faturamento do mês</div><div class="kpiValue">${money(faturamentoMes)}</div><div class="kpiHint">${monthOrders.length} OS no mês</div></div>
      <div class="kpi"><div class="kpiIcon">💵</div><div class="kpiLabel">Recebido no mês</div><div class="kpiValue">${money(recebidoMes)}</div><div class="kpiHint">Valores registrados</div></div>
      <div class="kpi"><div class="kpiIcon">🧾</div><div class="kpiLabel">A receber</div><div class="kpiValue">${money(aReceber)}</div><div class="kpiHint">Saldo das OS</div></div>
      <div class="kpi"><div class="kpiIcon">🔴</div><div class="kpiLabel">Pagamentos vencidos</div><div class="kpiValue">${vencidas}</div><div class="kpiHint">Contas em atraso</div></div>
    </div><div class="dashboardDeliveryNote">🚗 <b>${entregaHoje}</b> entrega(s) prevista(s) para hoje.</div>
    <div class="quickGrid">
      <div class="panel"><div class="sectionTitle"><h3>⚠️ Precisa da sua atenção</h3><span class="muted">${attention.length} item(ns)</span></div>${attention.length?attention.slice(0,7).map(a=>`<div class="attentionItem"><div class="attentionMain"><b>${esc(a.title)}</b><span>${esc(a.sub)}</span></div><button class="attentionBadge ${a.kind}" onclick="viewOS('${a.id}')">${esc(a.badge)}</button></div>`).join(''):'<div class="empty">Tudo em dia por aqui. Nenhuma pendência crítica.</div>'}</div>
      <div class="panel"><div class="sectionTitle"><h3>⚡ Acesso rápido</h3></div><button class="quickAction" onclick="page('os')"><span>🔧</span><div><strong>Nova Ordem de Serviço</strong><small>Criar orçamento ou atendimento</small></div></button><button class="quickAction" onclick="page('historico')"><span>📋</span><div><strong>Consultar OS</strong><small>Pesquisar e acompanhar serviços</small></div></button><button class="quickAction" onclick="page('clientes')"><span>👥</span><div><strong>Clientes</strong><small>Cadastros e histórico</small></div></button><button class="quickAction" onclick="page('financeiro')"><span>💰</span><div><strong>Financeiro</strong><small>Recebimentos e pendências</small></div></button><button class="quickAction" onclick="page('whatsapp')"><span>💬</span><div><strong>WhatsApp</strong><small>Mensagens prontas para seus clientes</small></div></button></div>
    </div>
    <div class="panel todayWorkshop" style="margin-top:14px"><div class="sectionTitle"><h3>🏁 Hoje na oficina</h3><span class="muted">Visão rápida</span></div><div class="todayGrid"><div><b>${execucao}</b><span>Em execução</span></div><div><b>${aguardandoPeca}</b><span>Aguardando peça</span></div><div><b>${entregaHoje}</b><span>Entrega(s) hoje</span></div><div><b>${data.ordens.filter(o=>o.status==='Concluída').length}</b><span>Prontos para entrega</span></div></div></div>
    <div class="panel" style="margin-top:14px"><div class="sectionTitle"><h3>📋 Últimas ordens de serviço</h3><button class="ghost" onclick="page('historico')">Ver histórico completo →</button></div>${recent.length?`<div class="tablewrap"><table><tr><th>OS</th><th>Cliente</th><th>Placa</th><th>Status</th><th>Pagamento</th><th>Total</th><th></th></tr>${recent.map(o=>`<tr><td>${esc(osLabel(o.numero))}</td><td>${esc(data.clientes.find(c=>c.id===o.cliente_id)?.nome||'')}</td><td>${esc(data.veiculos.find(v=>v.id===o.veiculo_id)?.placa||'')}</td><td><span class="status">${esc(o.status)}</span></td><td>${(()=>{const p=osPaymentInfo(o);return `<span class="miniPay ${p.key}">${p.icon} ${p.label}${p.saldo>0?` · ${money(p.saldo)}`:''}</span>`})()}</td><td>${money(o.total)}</td><td><button class="secondary" onclick="viewOS('${o.id}')">Abrir</button></td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma OS cadastrada ainda.</div>'}</div>
    <div class="muted" style="margin-top:14px;text-align:right">${data.clientes.length} clientes • ${data.veiculos.length} veículos • ${data.ordens.length} OS cadastradas</div>`;
}
async function addSimple(table,obj){obj.oficina_id=oficina.id;let {error}=await sb.from(table).insert(obj);if(error)throw error;data[table==='clientes'?'clientes':table==='veiculos'?'veiculos':table==='pecas'?'pecas':'servicos']=await refresh(table);toast('Cadastro salvo!')}
function clientes(){
  const q=(($('clienteSearch')?.value||'').trim().toLowerCase());
  const list=data.clientes.filter(c=>!q || [c.nome,c.cpf_cnpj,c.telefone,c.email].some(v=>String(v||'').toLowerCase().includes(q)));
  $('app').innerHTML=`<div class="pageHead"><div><h2>Clientes</h2><p class="muted">Cadastros, veículos vinculados e histórico de atendimento.</p></div><button class="primary" id="novoClienteBtn">+ Novo cliente</button></div>
  <div class="panel"><div class="row"><div class="field" style="flex:1"><label>Pesquisar cliente</label><input id="clienteSearch" placeholder="Nome, CPF/CNPJ, telefone ou e-mail" value="${esc(q)}"></div></div></div>
  <div class="panel" style="margin-top:16px"><div class="tablewrap"><table><tr><th>Cliente</th><th>CPF/CNPJ</th><th>Telefone</th><th>Veículos</th><th>OS</th><th></th></tr><tbody id="clientesTableBody">${list.map(c=>{
    const vs=data.veiculos.filter(v=>v.cliente_id===c.id).length;
    const os=data.ordens.filter(o=>o.cliente_id===c.id).length;
    const searchText=[c.nome,c.cpf_cnpj,c.telefone,c.email].map(v=>String(v||'').toLowerCase()).join(' ');
    return `<tr data-search="${esc(searchText)}"><td><b>${esc(c.nome)}</b><div class="muted">${esc(c.email||'')}</div></td><td>${esc(c.cpf_cnpj||'')}</td><td>${esc(c.telefone||'')}</td><td>${vs}</td><td>${os}</td><td><button class="secondary" onclick="clientePerfil('${c.id}')">Abrir</button></td></tr>`;
  }).join('')||'<tr><td colspan="6" class="muted">Nenhum cliente encontrado.</td></tr>'}</table></div></div>`;
  $('novoClienteBtn').onclick=()=>clienteFormulario();
  $('clienteSearch').oninput=()=>{ const el=$('clienteSearch'); const q=(el.value||'').trim().toLowerCase(); document.querySelectorAll('#clientesTableBody tr[data-search]').forEach(tr=>{tr.style.display=!q||tr.dataset.search.includes(q)?'':'none'}); };
}
function veiculos(){
  const q=(($('veiculoSearch')?.value||'').trim().toLowerCase());
  const list=data.veiculos.filter(v=>{const c=data.clientes.find(x=>x.id===v.cliente_id);return !q||[v.placa,v.marca,v.modelo,v.ano,c?.nome].some(x=>String(x||'').toLowerCase().includes(q))});
  $('app').innerHTML=`<div class="pageHead"><div><h2>Veículos</h2><p class="muted">Ficha do veículo, proprietário e histórico de serviços.</p></div><button class="primary" id="novoVeiculoBtn">+ Novo veículo</button></div>
  <div class="panel"><div class="field"><label>Pesquisar</label><input id="veiculoSearch" placeholder="Placa, modelo, marca ou cliente" value="${esc(q)}"></div></div>
  <div class="panel" style="margin-top:16px"><div class="tablewrap"><table><tr><th>Veículo</th><th>Placa</th><th>Cliente</th><th>KM</th><th>OS</th><th></th></tr>${list.map(v=>{const c=data.clientes.find(x=>x.id===v.cliente_id);const n=data.ordens.filter(o=>o.veiculo_id===v.id).length;return `<tr><td><b>${esc([v.marca,v.modelo].filter(Boolean).join(' ')||'Veículo')}</b><div class="muted">${esc(v.ano||'')} ${esc(v.cor||'')}</div></td><td>${esc(v.placa||'')}</td><td>${esc(c?.nome||'')}</td><td>${esc(v.km??0)}</td><td>${n}</td><td><button class="secondary" onclick="veiculoPerfil('${v.id}')">Abrir</button></td></tr>`}).join('')||'<tr><td colspan="6" class="muted">Nenhum veículo encontrado.</td></tr>'}</table></div></div>`;
  $('novoVeiculoBtn').onclick=()=>veiculoFormulario();
  $('veiculoSearch').oninput=()=>veiculos();
}
function clienteFormulario(id){
  const c=id?data.clientes.find(x=>x.id===id):null;
  if(id&&!c)return clientes();
  $('app').innerHTML=`<div class="toolbar"><button class="secondary" onclick="${c?'clientePerfil(\''+c.id+'\')':'clientes()'}">← Voltar</button></div>
  <div class="panel"><h2>${c?'Editar cliente':'Novo cliente'}</h2><div class="row">
  <div class="field"><label>Nome / Razão Social *</label><input id="cfNome" value="${esc(c?.nome||'')}"></div>
  <div class="field"><label>CPF/CNPJ</label><input id="cfDoc" value="${esc(c?.cpf_cnpj||'')}"></div>
  <div class="field"><label>Telefone / WhatsApp</label><input id="cfTel" value="${esc(c?.telefone||'')}"></div>
  <div class="field"><label>E-mail</label><input id="cfEmail" type="email" value="${esc(c?.email||'')}"></div>
  <div class="field" style="flex:1 1 100%"><label>Endereço</label><input id="cfEnd" value="${esc(c?.endereco||'')}"></div>
  <div class="field" style="flex:1 1 100%"><label>Observações</label><textarea id="cfObs" rows="4">${esc(c?.observacoes||'')}</textarea></div>
  </div><button class="primary" id="saveCliente">${c?'Salvar alterações':'Cadastrar cliente'}</button></div>`;
  $('saveCliente').onclick=async()=>{
    const nome=$('cfNome').value.trim(); if(!nome)return alert('Informe o nome.');
    const payload={nome,cpf_cnpj:$('cfDoc').value.trim(),telefone:$('cfTel').value.trim(),email:$('cfEmail').value.trim(),endereco:$('cfEnd').value.trim(),observacoes:$('cfObs').value.trim()||null};
    try{
      if(c){let r=await sb.from('clientes').update(payload).eq('id',c.id).eq('oficina_id',oficina.id);if(r.error)throw r.error;toast('Cliente atualizado com sucesso!');data.clientes=await refresh('clientes');clientePerfil(c.id)}
      else{let r=await sb.from('clientes').insert({...payload,oficina_id:oficina.id}).select().single();if(r.error)throw r.error;data.clientes=await refresh('clientes');toast('Cliente cadastrado com sucesso!');clientePerfil(r.data.id)}
    }catch(e){toast('Erro ao salvar cliente: '+e.message)}
  };
}
async function clientePerfil(id){
  if(!(await ensureConnection()))return;
  const c=data.clientes.find(x=>x.id===id); if(!c)return clientes();
  const vs=data.veiculos.filter(v=>v.cliente_id===id);
  let osRows=data.ordens.filter(o=>o.cliente_id===id).sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
  const clienteTotal=osRows.reduce((sum,o)=>sum+Math.max(0,Number(o.total||0)),0);
  const clientePago=osRows.reduce((sum,o)=>sum+Math.max(0,Number(o.valor_pago||0)),0);
  const clienteSaldo=Math.max(0,clienteTotal-clientePago);
  $('app').innerHTML=`<div class="toolbar"><button class="secondary" onclick="clientes()">← Clientes</button><button class="primary" onclick="clienteFormulario('${id}')">✏️ Editar cliente</button><button class="secondary" onclick="novaOSParaCliente('${id}')">+ Nova OS</button><button class="secondary" onclick="openWhatsAppClient('${id}')">💬 WhatsApp</button></div>
  <div class="panel"><div class="pageHead"><div><h2>${esc(c.nome)}</h2><p class="muted">${esc(c.cpf_cnpj||'CPF/CNPJ não informado')}</p></div><div class="status">${osRows.length} OS</div></div>
  <div class="profileGrid"><div><span>Telefone</span><b>${esc(c.telefone||'Não informado')}</b></div><div><span>E-mail</span><b>${esc(c.email||'Não informado')}</b></div><div><span>Endereço</span><b>${esc(c.endereco||'Não informado')}</b></div><div><span>Observações</span><b>${esc(c.observacoes||'—')}</b></div></div></div>
  <div class="panel clientFinancePanel" style="margin-top:16px"><div class="sectionTitle"><h3>💰 Situação financeira</h3><span class="muted">Histórico do cliente</span></div><div class="clientFinanceGrid"><div><span>Total das OS</span><b>${money(clienteTotal)}</b></div><div><span>Já pago</span><b>${money(clientePago)}</b></div><div><span>Em aberto</span><b>${money(clienteSaldo)}</b></div></div></div>
  <div class="panel" style="margin-top:16px"><div class="pageHead"><h3>🚗 Veículos</h3><button class="secondary" onclick="veiculoFormulario(null,'${id}')">+ Adicionar veículo</button></div><div class="cardsGrid">${vs.map(v=>`<div class="miniCard"><div><b>${esc([v.marca,v.modelo,v.ano].filter(Boolean).join(' ')||'Veículo')}</b><div class="muted">${esc(v.placa||'Sem placa')} • KM ${esc(v.km??0)}</div></div><button class="secondary" onclick="veiculoPerfil('${v.id}')">Abrir</button></div>`).join('')||'<div class="muted">Nenhum veículo cadastrado para este cliente.</div>'}</div></div>
  <div class="panel" style="margin-top:16px"><h3>📋 Histórico de OS</h3><div class="tablewrap"><table><tr><th>OS</th><th>Data</th><th>Veículo</th><th>Status</th><th>Pagamento</th><th>Total</th><th></th></tr>${osRows.map(o=>{let v=data.veiculos.find(x=>x.id===o.veiculo_id);const pay=osPaymentInfo(o);return `<tr><td>${esc(osLabel(o.numero))}</td><td>${o.created_at?new Date(o.created_at).toLocaleDateString('pt-BR'):''}</td><td>${esc([v?.marca,v?.modelo].filter(Boolean).join(' '))} ${esc(v?.placa||'')}</td><td><span class="status">${esc(o.status||'')}</span></td><td><span class="miniPay ${pay.key}">${pay.icon} ${pay.label}${pay.saldo>0?` · ${money(pay.saldo)}`:''}</span></td><td>${money(o.total)}</td><td><button class="secondary" onclick="viewOS('${o.id}')">Abrir</button></td></tr>`}).join('')||'<tr><td colspan="7" class="muted">Nenhuma OS encontrada.</td></tr>'}</table></div></div>`;
}
function novaOSParaCliente(id){page('os').then(()=>{const el=$('oc');if(el){el.value=id;el.dispatchEvent(new Event('change'))}})}
function veiculoFormulario(id,clienteId){
  const v=id?data.veiculos.find(x=>x.id===id):null;
  if(id&&!v)return veiculos();
  const opts=data.clientes.map(c=>`<option value="${c.id}" ${String(c.id)===String(clienteId||v?.cliente_id)?'selected':''}>${esc(c.nome)}</option>`).join('');
  $('app').innerHTML=`<div class="toolbar"><button class="secondary" onclick="${v?'veiculoPerfil(\''+v.id+'\')':(clienteId?"clientePerfil('"+clienteId+"')":'veiculos()')}">← Voltar</button></div>
  <div class="panel"><h2>${v?'Editar veículo':'Novo veículo'}</h2><div class="row">
  <div class="field"><label>Cliente *</label><select id="vfCliente"><option value="">Selecione...</option>${opts}</select></div>
  <div class="field"><label>Placa *</label><input id="vfPlaca" value="${esc(v?.placa||'')}"></div>
  <div class="field"><label>Marca</label><input id="vfMarca" value="${esc(v?.marca||'')}"></div>
  <div class="field"><label>Modelo</label><input id="vfModelo" value="${esc(v?.modelo||'')}"></div>
  <div class="field"><label>Ano</label><input id="vfAno" value="${esc(v?.ano||'')}"></div>
  <div class="field"><label>KM atual</label><input id="vfKm" type="number" value="${Number(v?.km||0)}"></div>
  <div class="field"><label>Cor</label><input id="vfCor" value="${esc(v?.cor||'')}"></div></div>
  <button class="primary" id="saveVeiculo">${v?'Salvar alterações':'Cadastrar veículo'}</button></div>`;
  $('saveVeiculo').onclick=async()=>{const cid=$('vfCliente').value,placa=$('vfPlaca').value.trim().toUpperCase();if(!cid||!placa)return alert('Informe cliente e placa.');const payload={cliente_id:cid,placa,marca:$('vfMarca').value.trim(),modelo:$('vfModelo').value.trim(),ano:$('vfAno').value.trim(),km:Number($('vfKm').value||0),cor:$('vfCor').value.trim()};try{if(v){let r=await sb.from('veiculos').update(payload).eq('id',v.id).eq('oficina_id',oficina.id);if(r.error)throw r.error;data.veiculos=await refresh('veiculos');toast('Veículo atualizado com sucesso!');veiculoPerfil(v.id)}else{let r=await sb.from('veiculos').insert({...payload,oficina_id:oficina.id}).select().single();if(r.error)throw r.error;data.veiculos=await refresh('veiculos');toast('Veículo cadastrado com sucesso!');veiculoPerfil(r.data.id)}}catch(e){toast('Erro ao salvar veículo: '+e.message)}};
}

async function movimentarEstoque(){let p=data.pecas.find(x=>x.id===$('mvPeca').value),q=Number($('mvQtd').value||0),tipo=$('mvTipo').value;if(!p||q<=0)return toast('Selecione a peça e informe uma quantidade válida.');let anterior=Number(p.estoque||0),novo=tipo==='Entrada'?anterior+q:anterior-q;if(novo<0)return toast('Quantidade maior que o estoque disponível.');try{let r=await sb.from('pecas').update({estoque:novo}).eq('id',p.id).eq('oficina_id',oficina.id);if(r.error)throw r.error;let mv=await sb.from('movimentacoes_estoque').insert({oficina_id:oficina.id,peca_id:p.id,tipo,quantidade:q,estoque_anterior:anterior,estoque_novo:novo});if(mv.error)throw mv.error;data.pecas=await refresh('pecas');data.movimentacoes_estoque=await refresh('movimentacoes_estoque');toast('Estoque atualizado!');estoque()}catch(e){toast('Erro: '+e.message)}}

function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
async function registrarRecebimento(id){if(!(await ensureConnection()))return;const o=data.ordens.find(x=>x.id===id);if(!o)return toast('OS não encontrada.');const saldo=Math.max(0,Number(o.total||0)-Number(o.valor_pago||0));if(saldo<=0)return toast('Esta OS já está totalmente paga.');const raw=prompt(`Saldo da ${osLabel(o.numero)}: ${money(saldo)}\n\nInforme o valor recebido:`);if(raw===null)return;const valor=Number(String(raw).replace(',','.'));if(!Number.isFinite(valor)||valor<=0||valor>saldo)return alert('Informe um valor válido, até o saldo da OS.');const forma=prompt('Forma de pagamento:',o.forma_pagamento||'Pix')||o.forma_pagamento||'Outro';const novoPago=Number(o.valor_pago||0)+valor,status=novoPago>=Number(o.total||0)?'Pago':'Parcial';try{let u=await sb.from('ordens_servico').update({valor_pago:novoPago,status_pagamento:status,forma_pagamento:forma}).eq('id',id).eq('oficina_id',oficina.id);if(u.error)throw u.error;let l=await sb.from('lancamentos_financeiros').insert({oficina_id:oficina.id,os_id:id,tipo:'recebimento',valor,data_lancamento:todayISO(),forma_pagamento:forma,categoria:'Recebimento de OS',descricao:`Recebimento ${osLabel(o.numero)}`});if(l.error)throw l.error;data.ordens=await refresh('ordens_servico');toast('Recebimento registrado com sucesso!');financeiro()}catch(e){toast('Erro ao registrar recebimento: '+e.message)}}

async function excluirOS(id){
  if(!(await ensureConnection()))return;
  const q=await sb.from('ordens_servico').select('id,numero,status,clientes(nome)').eq('id',id).eq('oficina_id',oficina.id).single();
  if(q.error)return toast('Erro ao localizar OS: '+q.error.message);
  const o=q.data;
  const nome=o.clientes?.nome||'cliente não informado';
  if(!confirm(`Excluir definitivamente a ${osLabel(o.numero)} de ${nome}?\n\nEsta ação remove a OS e seus itens do sistema. Não pode ser desfeita.`))return;
  const conf=prompt(`Para confirmar, digite o número da OS: ${osLabel(o.numero)}`);
  if(String(conf||'').trim()!==String(osLabel(o.numero)))return toast('Exclusão cancelada.');
  try{
    const tables=[['nfs_e','os_id'],['fotos_os','os_id'],['os_pecas','os_id'],['os_servicos','os_id']];
    for(const [table,col] of tables){const r=await sb.from(table).delete().eq(col,id);if(r.error && !String(r.error.message||'').toLowerCase().includes('does not exist'))throw r.error;}
    const r=await sb.from('ordens_servico').delete().eq('id',id).eq('oficina_id',oficina.id);if(r.error)throw r.error;
    data.ordens=(data.ordens||[]).filter(x=>x.id!==id);
    toast(`${osLabel(o.numero)} excluída com sucesso.`); await historico();
  }catch(e){console.error(e);toast('Não foi possível excluir a OS: '+(e?.message||String(e)))}
}
async function ensureCatalogForItem(type,x){
  let nome=String(x.nome||'').trim();
  if(!nome)throw new Error('Nome do item não informado.');
  let list=type==='peca'?data.pecas:data.servicos;
  let found=list.find(y=>String(y.nome||'').trim().toLowerCase()===nome.toLowerCase());
  if(found)return found.id;
  let table=type==='peca'?'pecas':'servicos';
  let obj={oficina_id:oficina.id,nome,preco:Number(x.valor||0)};
  if(type==='servico')obj.descricao=null;
  let r=await sb.from(table).insert(obj).select().single();
  if(r.error)throw r.error;
  list.push(r.data);
  return r.data.id;
}
function parseDiagnosticSections(text){
  const raw=String(text||'').trim();
  const out={diagnostico:'',executados:'',recomendacoes:'',legacy:''};
  if(!raw)return out;
  const hasLabels=/(^|\n)\s*(Diagnóstico|Serviços executados|Recomendações ao cliente)\s*:/i.test(raw);
  if(!hasLabels){out.legacy=raw;return out;}
  const re=/(?:^|\n)\s*(Diagnóstico|Serviços executados|Recomendações ao cliente)\s*:\s*/gi;
  let m, parts=[];
  while((m=re.exec(raw))){parts.push({label:m[1].toLowerCase(),start:m.index+m[0].length})}
  parts.forEach((part,i)=>{const end=i+1<parts.length?parts[i+1].start:raw.length;const text=raw.slice(part.start,end).trim();if(part.label.startsWith('diagn'))out.diagnostico=text;else if(part.label.startsWith('serv'))out.executados=text;else out.recomendacoes=text;});
  return out;
}
function composeDiagnosticSections(d,e,r,legacy){
  const parts=[]; if(String(d||'').trim())parts.push('Diagnóstico:\n'+String(d).trim()); if(String(e||'').trim())parts.push('Serviços executados:\n'+String(e).trim()); if(String(r||'').trim())parts.push('Recomendações ao cliente:\n'+String(r).trim()); if(String(legacy||'').trim())parts.push('Informação registrada anteriormente:\n'+String(legacy).trim()); return parts.join('\n\n');
}

function osPaymentInfo(o){
  const total=Math.max(0,Number(o?.total||0));
  const pago=Math.max(0,Number(o?.valor_pago||0));
  const saldo=Math.max(0,total-pago);
  if(total<=0)return {key:'noamount',label:'SEM VALOR DEFINIDO',icon:'⚪',saldo:0,pago,total};
  if(saldo<=0)return {key:'paid',label:'PAGO',icon:'🟢',saldo:0,pago,total};
  if(pago>0)return {key:'partial',label:'PAGO PARCIALMENTE',icon:'🟠',saldo,pago,total};
  return {key:'unpaid',label:'NÃO PAGO',icon:'🔴',saldo,pago,total};
}

function photoKey(id){return 'wr_garagem_os_photos_'+id}
function getLocalPhotos(id){try{return JSON.parse(localStorage.getItem(photoKey(id))||'[]')}catch{return []}}
function saveLocalPhotos(id,arr){localStorage.setItem(photoKey(id),JSON.stringify(arr))}
async function loadCloudPhotos(id){try{let q=await sb.from('fotos_os').select('id,os_id,arquivo_url,descricao,storage_path,created_at').eq('os_id',id).order('created_at',{ascending:false});if(q.error)throw q.error;return q.data||[]}catch(e){console.warn('Erro ao carregar fotos da OS:',e);return []}}
function photoStage(desc){
  const raw=String(desc||'').trim();
  const m=raw.match(/^(ANTES|DURANTE|DEPOIS)\s*[—-]\s*/i);
  return m?m[1].toUpperCase():'OUTRAS';
}
function photoDescription(desc){
  const raw=String(desc||'Foto da OS').trim();
  return raw.replace(/^(ANTES|DURANTE|DEPOIS)\s*[—-]\s*/i,'').trim()||'Foto da OS';
}
function groupPhotosByStage(photos){
  const groups={ANTES:[],DURANTE:[],DEPOIS:[],OUTRAS:[]};
  (photos||[]).forEach(x=>groups[photoStage(x.descricao||x.desc)].push(x));
  return groups;
}
function photoStageTitle(stage){
  return {ANTES:'🔵 ANTES DO SERVIÇO',DURANTE:'🟡 DURANTE O SERVIÇO',DEPOIS:'🟢 DEPOIS DO SERVIÇO',OUTRAS:'📷 OUTRAS FOTOS'}[stage]||stage;
}
function photoCardHTML(x,id,localIndex){
  const isLocal=typeof localIndex==='number';

    ? `<button class="danger" onclick="deleteOSPhoto('${id}',${localIndex})">Excluir</button>`
    : `<button class="danger" onclick="deleteCloudPhoto('${id}','${x.id}','${esc(x.storage_path||'')}')">Excluir</button>`;
  return `<div class="photoCard"><img src="${esc(src)}" alt="${esc(photoStageTitle(stage))}"><div class="photoStageBadge">${esc(stage)}</div><div class="photoMeta">${esc(meta)}${isLocal?' <span class="muted">(nesta sessão)</span>':''}</div><div class="photoActions">${action}</div></div>`;

async function renderPhotos(id){

function compressPhoto(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let max=1400,w=im.width,h=im.height;if(w>max||h>max){let k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k)}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);c.toBlob(b=>resolve(b),'image/jpeg',.72)};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}

function whatsappPickTemplate(template){
  const rows=(data.ordens||[]).filter(o=>o.status!=='Cancelada').sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
  if(!rows.length)return alert('Cadastre uma OS para usar as mensagens prontas.');

  document.body.appendChild(modal);
}
function chooseWhatsAppOS(template){const id=$('waChooseOS')?.value;if(!id)return;closeWhatsAppComposer();openWhatsAppComposer(id,template)}
function defaultWhatsAppTemplate(o){
  const st=String(o.status||'');
  const saldo=Math.max(0,Number(o.total||0)-Number(o.valor_pago||0));
  if(st==='Orçamento'||st==='Aguardando aprovação')return 'orcamento';
  if(st==='Em execução'||st==='Aguardando peça')return 'andamento';
  if(st==='Concluída'||st==='Entregue')return saldo>0?'pronto':'pronto';
  return saldo>0?'pagamento':'andamento';
}

  if(!$('printArea')){ window.print(); return; }
  const c=data.clientes.find(x=>x.id===$('oc')?.value), v=data.veiculos.find(x=>x.id===$('ov')?.value), z=calc();
  const pe=itemsP.map(x=>{let r=data.pecas.find(p=>p.id===x.ref);return {nome:r?.nome||'',qtd:x.qtd,valor:x.valor,total:x.qtd*x.valor}});
  const se=itemsS.map(x=>{let r=data.servicos.find(q=>q.id===x.ref);return {nome:r?.nome||'',qtd:x.qtd,valor:x.valor,total:x.qtd*x.valor}});
  const pRows=pe.map(x=>`<tr><td>${esc(x.nome)}</td><td>${x.qtd}</td><td>${money(x.valor)}</td><td>${money(x.total)}</td></tr>`); const sRows=se.map(x=>`<tr><td>${esc(x.nome)}</td><td>${x.qtd}</td><td>${money(x.valor)}</td><td>${money(x.total)}</td></tr>`);
  $('printArea').innerHTML=`<div class="printHeader"><img src="logo-wr-garagem.png" class="osLogo" alt="WR Garagem"><div><h1>WR Garagem</h1><small>Manutenção • Confiança • Performance</small></div></div><h2>Ordem de Serviço</h2><div class="printMeta"><div><b>Cliente:</b> ${esc(c?.nome)}</div><div><b>Telefone:</b> ${esc(c?.telefone)}</div><div><b>Veículo:</b> ${esc([v?.marca,v?.modelo,v?.ano].filter(Boolean).join(' '))}</div><div><b>Placa:</b> ${esc(v?.placa)}</div><div><b>KM:</b> ${esc($('okm')?.value)}</div><div><b>Previsão:</b> ${esc($('oent')?.value)}</div><div><b>Status:</b> ${esc($('ost')?.value)}</div><div><b>Pagamento:</b> ${esc($('opag')?.value)}</div></div><div class="printSection"><h3>🔩 Peças / Produtos</h3><table class="printTable"><thead><tr><th>Peça</th><th>Qtd.</th><th>Valor unit.</th><th>Total</th></tr></thead><tbody>${pRows.length?pRows.join(''):'<tr><td colspan="4">Nenhuma peça informada.</td></tr>'}</tbody></table></div><div class="printSection"><h3>🔧 Serviços</h3><table class="printTable"><thead><tr><th>Serviço</th><th>Qtd.</th><th>Valor unit.</th><th>Total</th></tr></thead><tbody>${sRows.length?sRows.join(''):'<tr><td colspan="4">Nenhum serviço informado.</td></tr>'}</tbody></table></div><div class="printSection"><h3>Diagnóstico / serviços executados / recomendações</h3><p>${esc($('odiag')?.value||'')}</p><h3>Observações</h3><p>${esc($('oobs')?.value||'')}</p></div><div class="printAreaTotal">Desconto: ${money(z.d)}<br>TOTAL: ${money(z.t)}</div><div class="sigGrid"><div class="sigBox">Assinatura do cliente</div><div class="sigBox">Assinatura do responsável pelo serviço</div></div>`;
  window.print();
  document.body.classList.remove('printingNewOS');
}
if(new URLSearchParams(location.search).get('cliente'))initPublic();else init();

      '<p class="wr-fiscal-note">Este controle fica separado da OS. Depois de uma emissão real, poderemos registrar o número, a data e o link da NFS-e sem alterar orçamento, aprovação, fotos, PDF ou histórico.</p>'+
      '<div class="wr-fiscal-actions"><button type="button" class="secondary" id="wrFiscalRegistrar">Registrar NFS-e emitida</button></div>'+
      '<div id="wrFiscalRegistroMsg" class="wr-fiscal-note"></div></div>'+
      '<div class="panel"><h3>Emissão oficial</h3><p class="wr-fiscal-note">A WR Garagem prepara os dados. A emissão oficial da NFS-e será feita no Ambiente Nacional.</p></div>'+
      '</div>';

    function carregarControleNfse(osId){
      var statusEl=document.getElementById('wrFiscalStatus'),numEl=document.getElementById('wrFiscalNumero'),dataEl=document.getElementById('wrFiscalDataEmissao'),linkEl=document.getElementById('wrFiscalLink');
      statusEl.textContent='Carregando...'; numEl.textContent='—'; dataEl.textContent='—'; linkEl.textContent='—';
      if(!sb || typeof sb.from!=='function'){statusEl.textContent='Não emitida';return;}
      sb.from('nfs_e').select('status,numero,data_emissao,link_nfse').eq('os_id',osId).eq('oficina_id',oficina.id).maybeSingle().then(function(r){
        if(r.error){
          console.warn('Controle NFS-e indisponível:',r.error.message);
          statusEl.textContent='Não emitida';
          document.getElementById('wrFiscalRegistroMsg').textContent='Erro ao consultar a NFS-e: '+(r.error.message||'erro desconhecido')+' (código '+(r.error.code||'sem código')+').';
          return;
        }
        var x=r.data;
        statusEl.textContent=x?.status||'Não emitida';
        numEl.textContent=x?.numero||'—';
        dataEl.textContent=x?.data_emissao?new Date(x.data_emissao).toLocaleDateString('pt-BR'):'—';
        if(x?.link_nfse){linkEl.innerHTML='<a href="'+fesc(x.link_nfse)+'" target="_blank" rel="noopener">Abrir NFS-e</a>';}
      });
    }
    var sel=document.getElementById('wrFiscalOS');
    var list=Array.isArray(data&&data.ordens)?data.ordens.slice():[];
    list.sort(function(a,b){return String(b.created_at||'').localeCompare(String(a.created_at||''))});
    sel.innerHTML='<option value="">Selecione uma OS...</option>'+list.map(function(o){return '<option value="'+fesc(o.id)+'">OS '+fesc(typeof osLabel==='function'?osLabel(o.numero):o.numero||o.id)+'</option>'}).join('');
    if(!list.length){
      sel.innerHTML='<option value="">Nenhuma OS carregada</option>';
      return;
    }
    sel.onchange=function(){
      var id=sel.value;if(!id)return;
      document.getElementById('wrFiscalDataPanel').style.display='block';
      carregarControleNfse(id);
      var local=list.find(function(x){return String(x.id)===String(id)});
      if(!sb || typeof sb.from!=='function'){
        document.getElementById('wrFiscalMsg').textContent='Conexão com o banco ainda não disponível.';
        return;
      }
      Promise.all([
        sb.from('ordens_servico').select('*, clientes(nome,cpf_cnpj,telefone,email), veiculos(marca,modelo,ano,placa,km)').eq('id',id).single(),
        fitems(id)
      ]).then(function(r){
        if(r[0].error)throw r[0].error;
        var full=r[0].data||local, itens=r[1]||[];
        var serv=itens.filter(function(x){return x.tipo==='Serviço'}),pec=itens.filter(function(x){return x.tipo==='Peça'});
        var st=serv.reduce(function(a,x){return a+x.qtd*x.valor-x.desconto},0),pt=pec.reduce(function(a,x){return a+x.qtd*x.valor-x.desconto},0);
        document.getElementById('wrFiscalCliente').textContent=full.clientes&&full.clientes.nome||'';
        document.getElementById('wrFiscalDoc').textContent=full.clientes&&full.clientes.cpf_cnpj||'Não informado';
        document.getElementById('wrFiscalVeiculo').textContent=[full.veiculos&&full.veiculos.marca,full.veiculos&&full.veiculos.modelo,full.veiculos&&full.veiculos.ano,full.veiculos&&full.veiculos.placa].filter(Boolean).join(' ');
        document.getElementById('wrFiscalServTotal').textContent=fmoney(st);
        document.getElementById('wrFiscalPecTotal').textContent=fmoney(pt);
        document.getElementById('wrFiscalNfseTotal').textContent=fmoney(st);
        document.getElementById('wrFiscalTotal').textContent=fmoney(full.total);
        document.getElementById('wrFiscalItems').innerHTML='<table class="wr-fiscal-table"><tr><th>Tipo</th><th>Item</th><th>Qtd.</th><th>Total</th></tr>'+itens.map(function(x){return '<tr><td>'+fesc(x.tipo)+'</td><td>'+fesc(x.nome)+'</td><td>'+fesc(x.qtd)+'</td><td>'+fmoney(x.qtd*x.valor-x.desconto)+'</td></tr>'}).join('')+'</table>';
        var nomesServ=serv.map(function(x){return x.nome}).filter(Boolean);
        var descricao=nomesServ.join('; ')||'Serviço de manutenção/reparo automotivo';
        document.getElementById('wrFiscalDescricao').value=descricao;
        document.getElementById('wrFiscalNfseTotal2').textContent=fmoney(st);
        var text='WR GARAGEM — DADOS PARA NFS-e\nOS '+(typeof osLabel==='function'?osLabel(full.numero):full.numero||'')+'\nCliente: '+(full.clientes&&full.clientes.nome||'')+'\nCPF/CNPJ: '+(full.clientes&&full.clientes.cpf_cnpj||'Não informado')+'\nDescrição do serviço: '+descricao+'\nCódigo de Tributação Nacional: 140101 (14.01.01)\nValor dos serviços / NFS-e: '+fmoney(st)+'\nPeças (separadas): '+fmoney(pt)+'\nTotal da OS: '+fmoney(full.total);
        document.getElementById('wrFiscalCopy').onclick=function(){
      var text='WR GARAGEM — DADOS PARA NFS-e\nOS '+(typeof osLabel==='function'?osLabel(full.numero):full.numero||'')+
        '\nCliente: '+(full.clientes&&full.clientes.nome||'')+
        '\nCPF/CNPJ: '+(full.clientes&&full.clientes.cpf_cnpj||'Não informado')+
        '\nDescrição do serviço: '+descricao+
        '\nCódigo de Tributação Nacional: 140101 (14.01.01)'+
        '\nValor dos serviços / NFS-e: '+fmoney(st)+
        '\nPeças (separadas): '+fmoney(pt)+
        '\nTotal da OS: '+fmoney(full.total);
      function ok(){document.getElementById('wrFiscalMsg').textContent='Dados da emissão copiados. Agora você pode abrir o Emissor NFS-e.'}
      function fail(){document.getElementById('wrFiscalMsg').textContent='Não foi possível copiar automaticamente. Você pode selecionar e copiar os dados manualmente.'}
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(ok).catch(function(){
          try{
            var ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0';
            document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); ok();
          }catch(e){fail();}
        });
      }else{
        try{
          var ta2=document.createElement('textarea'); ta2.value=text; ta2.style.position='fixed'; ta2.style.opacity='0';
          document.body.appendChild(ta2); ta2.focus(); ta2.select(); document.execCommand('copy'); document.body.removeChild(ta2); ok();
        }catch(e){fail();}
      }
    };
        document.getElementById('wrFiscalOpen').onclick=function(){window.open('https://www.nfse.gov.br/EmissorNacional','_blank')};
        document.getElementById('wrFiscalRegistrar').onclick=function(){
          var numero=prompt('Número da NFS-e emitida:');
          if(!numero || !String(numero).trim())return;
          var link=prompt('Link da NFS-e (opcional):','');
          if(!sb || typeof sb.from!=='function')return alert('Banco de dados não conectado.');
          var payload={oficina_id:oficina.id,os_id:id,status:'Emitida',numero:String(numero).trim(),data_emissao:new Date().toISOString(),link_nfse:(link||'').trim()||null};
          document.getElementById('wrFiscalRegistroMsg').textContent='Salvando NFS-e...';
          sb.from('nfs_e').upsert(payload,{onConflict:'os_id'}).then(function(r){
            if(r.error){document.getElementById('wrFiscalRegistroMsg').textContent='Não foi possível registrar: '+r.error.message+' (código '+(r.error.code||'sem código')+').';return;}
            document.getElementById('wrFiscalRegistroMsg').textContent='NFS-e registrada com sucesso. Data de emissão preenchida automaticamente.';
            var rb=document.getElementById('wrFiscalRegistrar'); if(rb) rb.textContent='Atualizar NFS-e registrada';
            carregarControleNfse(id);
          });
        };
        document.getElementById('wrFiscalMsg').textContent='Dados carregados com sucesso.';
      }).catch(function(err){document.getElementById('wrFiscalMsg').textContent='Erro ao carregar a OS: '+String(err.message||err);});
    };
  };

  addFiscalNav();
  setTimeout(addFiscalNav,500);
  setTimeout(addFiscalNav,1500);
})();
</script>
</body></html>
