<style>
:root{--bg:#0d0f10;--panel:#151819;--panel2:#1b1e1f;--line:#2b3032;--text:#f2f3f3;--muted:#9ba2a5;--accent:#d7a84b;--green:#20b26b;--danger:#d85d5d}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}header{height:68px;background:#090a0b;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}header h1{margin:0;font-size:21px;letter-spacing:.2px}header small{color:var(--muted)}.brand{display:flex;gap:10px;align-items:center}.logo{width:38px;height:38px;border:1px solid #4a4f51;border-radius:9px;display:grid;place-items:center;color:var(--accent);font-weight:800}.userbar{display:flex;gap:10px;align-items:center}.wrap{display:flex;min-height:calc(100vh - 68px)}nav{width:225px;background:#101213;border-right:1px solid var(--line);padding:12px;flex:none}nav button{display:block;width:100%;padding:12px 13px;margin:4px 0;border:0;background:transparent;color:#cdd1d2;text-align:left;border-radius:8px}nav button.active,nav button:hover{background:#1b1e20;color:white}main{flex:1;padding:22px;max-width:1500px;margin:auto;width:100%}h2{margin:0 0 16px}h3{margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}.card b{display:block;font-size:25px;margin-top:7px}.muted{color:var(--muted);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:160px}.field{margin-bottom:12px}label{display:block;font-size:12px;font-weight:700;color:#cdd1d2;margin-bottom:6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #3a4042;border-radius:7px;background:#0f1112;color:#f1f2f2;outline:none}input:focus,select:focus,textarea:focus{border-color:#7f8588}textarea{min-height:100px;resize:vertical}.primary,.secondary,.danger,.ghost{border:0;border-radius:7px;padding:10px 14px;font-weight:700}.primary{background:var(--accent);color:#111}.secondary{background:#2b3032;color:#fff}.danger{background:#552b2b;color:#ffd8d8}.ghost{background:transparent;color:#ddd;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;overflow:hidden}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:#bfc4c6;background:#191c1d}td{color:#e8e9e9}.tablewrap{overflow:auto}.total{text-align:right;font-size:21px;font-weight:800;padding-top:14px}.status{display:inline-block;padding:5px 8px;border-radius:99px;background:#272b2c;font-size:11px}.empty{padding:22px;text-align:center;color:var(--muted)}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:50}.modalbox{width:min(520px,100%);background:#151819;border:1px solid #363b3d;border-radius:14px;padding:20px}.notice{background:#211f18;border:1px solid #4c4127;color:#e8d49e;padding:11px;border-radius:8px;font-size:13px;margin-bottom:14px}.toast{position:fixed;right:18px;bottom:18px;background:#202526;border:1px solid #3b4143;padding:12px 14px;border-radius:8px;z-index:80}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.dangerText{color:#ff9b9b}.hideMobile{display:block}@media(max-width:800px){header{padding:0 12px}header small{display:none}.wrap{display:block}nav{width:100%;display:flex;overflow:auto;position:sticky;top:68px;z-index:9;border-right:0;border-bottom:1px solid var(--line);padding:7px}nav button{min-width:max-content;width:auto;margin:0 3px;text-align:center}.grid{grid-template-columns:repeat(2,1fr)}main{padding:12px}.row>*{min-width:100%}.hideMobile{display:none}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.card{padding:12px}th,td{font-size:12px}}
@media print{header,nav,.noPrint{display:none!important}.photoUploadControl{display:none!important}.photosPanel{display:block!important;page-break-before:always!important;background:#fff!important;color:#111!important;border:1px solid #ccc!important}.photosPanel .photoGrid{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:12px!important}.photosPanel .photoCard{background:#fff!important;color:#111!important;border:1px solid #bbb!important;page-break-inside:avoid!important}.photosPanel .photoCard img{display:block!important;width:100%!important;height:auto!important;max-height:280px!important;object-fit:contain!important;background:#fff!important}.photosPanel .photoMeta{color:#111!important}body{background:white;color:#111}.panel,.card{border:1px solid #ccc;box-shadow:none;background:white;color:#111}main{max-width:none}.printOnly{display:block!important}#printArea{display:block!important}body.printingNewOS #app > *:not(#printArea){display:none!important}.photosPanel{display:block!important;background:#fff!important;color:#111!important;border:1px solid #ccc!important;page-break-inside:avoid}.photosPanel .row>div:last-child{display:none!important}.photosPanel .photoGrid{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:12px!important}.photosPanel .photoCard{background:#fff!important;color:#111!important;border:1px solid #bbb!important;box-shadow:none!important;page-break-inside:avoid}.photosPanel .photoCard img{width:100%!important;height:auto!important;max-height:280px!important;object-fit:contain!important;display:block!important;background:#fff!important}.photosPanel .photoMeta{color:#111!important}.printTable{width:100%;border-collapse:collapse;margin-top:14px}.printTable th,.printTable td{border:1px solid #777;padding:8px;font-size:12px;color:#111!important;background:#fff}.printTable th{background:#222;color:#fff!important;font-weight:800}.printTable tr:nth-child(even) td{background:#f4f4f4}.printSection{margin-top:18px}.printMeta{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}.printMeta div{padding:7px;border-bottom:1px solid #ddd}.printAreaTotal{text-align:right;font-size:18px;font-weight:800;margin-top:15px;color:#111}.printSection p{color:#111;line-height:1.45;margin:6px 0}.printHeader h1{color:#111}.printHeader small{color:#333!important}}
.printOnly{display:none}.osLogo{width:190px;height:92px;object-fit:contain;object-position:left center;display:block}.sigGrid{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:55px}.sigBox{text-align:center;padding-top:42px;border-top:1px solid #222;font-size:13px}.printHeader{display:flex;align-items:center;gap:18px;border-bottom:2px solid #222;padding-bottom:12px;margin-bottom:18px}.printHeader h1{margin:0;font-size:24px}.printHeader small{display:block;color:#444;margin-top:4px}@media(max-width:600px){.sigGrid{grid-template-columns:1fr;gap:60px}}
@media print{.sigGrid{grid-template-columns:1fr 1fr!important;gap:50px!important}.sigBox{color:#111!important;min-height:55px}.printHeader{gap:14px}.osLogo{width:190px;height:92px}}

.publicPage{max-width:900px;margin:0 auto;padding:18px}.publicBrand{text-align:center;padding:18px 0}.publicBrand img{width:190px;max-width:70%;height:92px;object-fit:contain}.publicStatus{font-size:16px;padding:8px 12px;border-radius:999px;display:inline-block;background:#272b2c;margin:6px 0 14px}.publicPhotoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.publicPhoto{background:#151819;border:1px solid var(--line);border-radius:10px;overflow:hidden}.publicPhoto img{width:100%;height:180px;object-fit:cover;display:block}.publicPhoto div{padding:8px;font-size:12px;color:#ddd}.photoGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}.photoCard{border:1px solid #333;border-radius:10px;overflow:hidden;background:#151819}.photoCard img{width:100%;height:130px;object-fit:cover;display:block}.photoMeta{padding:8px;font-size:12px}.photoActions{display:flex;gap:6px;padding:0 8px 8px}.photoInput{display:none}
</style>

<style id="wr-os-table-final">

<body>
<header><div class="brand"><div class="logo">WR</div><div><h1>WR Garagem</h1><small id="today"></small></div></div><div class="userbar"><span id="userEmail" class="muted"></span><button class="ghost noPrint" id="logoutBtn">Sair</button></div></header>
<div class="wrap"><nav id="nav" class="noPrint">
<button data-page="dashboard" class="active">📊 Dashboard</button><button data-page="os">➕ Nova OS</button><button data-page="clientes">👥 Clientes</button><button data-page="veiculos">🚗 Veículos</button><button data-page="pecas">📦 Peças</button><button data-page="estoque">📦 Estoque</button><button data-page="financeiro">💰 Financeiro</button><button data-page="servicos">🔧 Serviços</button><button data-page="historico">📋 Histórico</button>
</nav><main id="app"></main></div>
<div id="loginModal" class="modal hidden"><div class="modalbox"><h2>Entrar no WR Garagem</h2><div class="notice">Primeiro configure a conexão com o seu projeto Supabase. Use somente a <b>Publishable Key</b>; nunca use a Secret/service_role key.</div><div class="field"><label>Project URL</label><input id="cfgUrl" placeholder="https://seu-projeto.supabase.co"></div><div class="field"><label>Publishable Key</label><input id="cfgKey" type="password" placeholder="sb_publishable_..."></div><div class="field"><label>E-mail</label><input id="loginEmail" type="email"></div><div class="field"><label>Senha</label><input id="loginPassword" type="password"></div><button class="primary" id="loginBtn">Entrar</button><p id="loginMsg" class="muted"></p></div></div>
<div id="toast" class="toast hidden"></div>
<script>
const CONFIG_KEY='wr_garagem_supabase_config_v1';
let sb=null, session=null, oficina=null, data={clientes:[],veiculos:[],pecas:[],servicos:[],ordens:[],movimentacoes_estoque:[]};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const osLabel=n=>'OS-'+String(Number(n)||0).padStart(5,'0');
const toast=(m)=>{$('toast').textContent=m;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)};
$('today').textContent=new Date().toLocaleDateString('pt-BR');
function getCfg(){try{return JSON.parse(localStorage.getItem(CONFIG_KEY)||'null')}catch{return null}}
function setCfg(c){localStorage.setItem(CONFIG_KEY,JSON.stringify(c))}
async function init(){let c=getCfg();if(c?.url&&c?.key){connect(c.url,c.key)}else showLogin('');}
function connect(url,key){sb=window.supabase.createClient(url.trim(),key.trim());sb.auth.onAuthStateChange((_e,s)=>{session=s;if(s){$('loginModal').classList.add('hidden');$('userEmail').textContent=s.user.email||'';loadAll()}else showLogin('')});}
function showLogin(msg){$('loginModal').classList.remove('hidden');if(msg)$('loginMsg').textContent=msg;let c=getCfg();if(c){$('cfgUrl').value=c.url;$('cfgKey').value=c.key}}
$('loginBtn').onclick=async()=>{let url=$('cfgUrl').value.trim(),key=$('cfgKey').value.trim(),email=$('loginEmail').value.trim(),password=$('loginPassword').value;if(!url||!key||!email||!password){$('loginMsg').textContent='Preencha URL, Publishable Key, e-mail e senha.';return}setCfg({url,key});connect(url,key);$('loginMsg').textContent='Entrando...';let {error}=await sb.auth.signInWithPassword({email,password});if(error)$('loginMsg').textContent=error.message};
$('logoutBtn').onclick=async()=>{if(sb)await sb.auth.signOut()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));
function page(p){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({dashboard,os,clientes,veiculos,pecas,estoque,financeiro,servicos,historico}[p])()}
async function loadAll(){try{if(!session?.user?.id)throw new Error('Sessão do usuário não encontrada.');let m=await sb.from('oficina_usuarios').select('oficina_id').eq('user_id',session.user.id).limit(1).maybeSingle();if(m.error)throw m.error;if(!m.data?.oficina_id){toast('Usuário sem oficina vinculada.');return}let o=await sb.from('oficinas').select('*').eq('id',m.data.oficina_id).single();if(o.error)throw o.error;if(!o.data){toast('Oficina não encontrada.');return}oficina=o.data;let tables=['clientes','veiculos','pecas','servicos','ordens_servico','movimentacoes_estoque'];let out=await Promise.all(tables.map(t=>sb.from(t).select('*').eq('oficina_id',oficina.id)));for(let i=0;i<out.length;i++){if(out[i].error)throw out[i].error}data.clientes=out[0].data||[];data.veiculos=out[1].data||[];data.pecas=out[2].data||[];data.servicos=out[3].data||[];data.ordens=out[4].data||[];data.movimentacoes_estoque=out[5].data||[];page('dashboard')}catch(e){console.error(e);toast('Erro ao carregar dados: '+e.message)}}
async function refresh(t){let {data:d,error}=await sb.from(t).select('*').eq('oficina_id',oficina.id);if(error)throw error;return d||[]}
function dashboard(){let abertas=data.ordens.filter(x=>!['Concluída','Entregue','Cancelada'].includes(x.status)).length,total=data.ordens.reduce((s,x)=>s+Number(x.total||0),0),recebido=data.ordens.reduce((s,x)=>s+Number(x.valor_pago||0),0),aReceber=Math.max(0,total-recebido);$('app').innerHTML=`<h2>Dashboard</h2><div class="grid"><div class="card">OS em aberto<b>${abertas}</b></div><div class="card">Clientes<b>${data.clientes.length}</b></div><div class="card">Veículos<b>${data.veiculos.length}</b></div><div class="card">Faturamento OS<b>${money(total)}</b></div><div class="card">A receber<b>${money(aReceber)}</b></div></div><div class="panel" style="margin-top:16px"><h3>Últimas ordens de serviço</h3>${data.ordens.length?`<div class="tablewrap"><table><tr><th>OS</th><th>Cliente</th><th>Placa</th><th>Status</th><th>Total</th></tr>${data.ordens.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).slice(0,8).map(o=>`<tr><td>${esc(osLabel(o.numero))}</td><td>${esc(data.clientes.find(c=>c.id===o.cliente_id)?.nome||'')}</td><td>${esc(data.veiculos.find(v=>v.id===o.veiculo_id)?.placa||'')}</td><td><span class="status">${esc(o.status)}</span></td><td>${money(o.total)}</td></tr>`).join('')}</table></div>`:'<div class="empty">Nenhuma OS cadastrada ainda.</div>'}</div>`}
async function addSimple(table,obj){obj.oficina_id=oficina.id;let {error}=await sb.from(table).insert(obj);if(error)throw error;data[table==='clientes'?'clientes':table==='veiculos'?'veiculos':table==='pecas'?'pecas':'servicos']=await refresh(table);toast('Cadastro salvo!')}
function clientes(){ $('app').innerHTML=`<h2>Clientes</h2><div class="panel"><div class="row"><div class="field"><label>Nome / Razão Social</label><input id="cn"></div><div class="field"><label>CPF/CNPJ</label><input id="cd"></div><div class="field"><label>Telefone</label><input id="ct"></div><div class="field"><label>E-mail</label><input id="ce"></div><div class="field"><label>Endereço</label><input id="cend"></div></div><button class="primary" id="addCliente">Cadastrar cliente</button></div><div class="panel" style="margin-top:16px"><div class="tablewrap"><table><tr><th>Nome</th><th>CPF/CNPJ</th><th>Telefone</th><th></th></tr>${data.clientes.map(c=>`<tr><td>${esc(c.nome)}</td><td>${esc(c.cpf_cnpj)}</td><td>${esc(c.telefone)}</td><td><button class="danger" onclick="delRow('clientes','${c.id}')">Excluir</button></td></tr>`).join('')}</table></div></div>`;$('addCliente').onclick=async()=>{if(!$('cn').value.trim())return alert('Informe o nome.');try{await addSimple('clientes',{nome:$('cn').value.trim(),cpf_cnpj:$('cd').value,telefone:$('ct').value,email:$('ce').value,endereco:$('cend').value,observacoes:null});clientes()}catch(e){toast('Erro: '+e.message)}}}
function veiculos(){let opts=data.clientes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');$('app').innerHTML=`<h2>Veículos</h2><div class="panel"><div class="row"><div class="field"><label>Cliente</label><select id="vc"><option value="">Selecione...</option>${opts}</select></div><div class="field"><label>Placa</label><input id="vp"></div><div class="field"><label>Marca</label><input id="vm"></div><div class="field"><label>Modelo</label><input id="vmod"></div><div class="field"><label>Ano</label><input id="va"></div><div class="field"><label>KM atual</label><input id="vkm" type="number"></div><div class="field"><label>Cor</label><input id="vcor"></div></div><button class="primary" id="addVeiculo">Cadastrar veículo</button></div><div class="panel" style="margin-top:16px"><div class="tablewrap"><table><tr><th>Cliente</th><th>Placa</th><th>Veículo</th><th>KM</th><th></th></tr>${data.veiculos.map(v=>`<tr><td>${esc(data.clientes.find(c=>c.id===v.cliente_id)?.nome||'')}</td><td>${esc(v.placa)}</td><td>${esc(v.marca)} ${esc(v.modelo)} ${esc(v.ano)}</td><td>${v.km??''}</td><td><button class="danger" onclick="delRow('veiculos','${v.id}')">Excluir</button></td></tr>`).join('')}</table></div></div>`;$('addVeiculo').onclick=async()=>{if(!$('vc').value||!$('vp').value.trim())return alert('Informe cliente e placa.');try{await addSimple('veiculos',{cliente_id:$('vc').value,placa:$('vp').value.toUpperCase(),marca:$('vm').value,modelo:$('vmod').value,ano:$('va').value,km:Number($('vkm').value||0),cor:$('vcor').value});veiculos()}catch(e){toast('Erro: '+e.message)}}}
function pecas(){ $('app').innerHTML=`<h2>Peças</h2><div class="panel"><div class="row"><div class="field"><label>Código</label><input id="pc"></div><div class="field"><label>Descrição</label><input id="pd"></div><div class="field"><label>Marca</label><input id="pm"></div><div class="field"><label>Preço padrão</label><input id="pp" type="number" step=".01"></div><div class="field"><label>Estoque</label><input id="pe" type="number" step=".01"></div><div class="field"><label>Estoque mínimo</label><input id="pem" type="number" step=".01"></div></div><button class="primary" id="addPeca">Cadastrar peça</button></div><div class="panel" style="margin-top:16px"><div class="tablewrap"><table><tr><th>Código</th><th>Descrição</th><th>Marca</th><th>Preço</th><th>Estoque</th><th></th></tr>${data.pecas.map(p=>`<tr><td>${esc(p.codigo)}</td><td>${esc(p.nome)}</td><td>${esc(p.marca)}</td><td>${money(p.preco)}</td><td>${p.estoque||0}</td><td><button class="danger" onclick="delRow('pecas','${p.id}')">Excluir</button></td></tr>`).join('')}</table></div></div>`;$('addPeca').onclick=async()=>{if(!$('pd').value.trim())return alert('Informe a descrição.');try{await addSimple('pecas',{codigo:$('pc').value||'P'+(data.pecas.length+1),nome:$('pd').value.trim(),marca:$('pm').value,preco:Number($('pp').value||0),estoque:Number($('pe').value||0),estoque_minimo:Number($('pem').value||0)});pecas()}catch(e){toast('Erro: '+e.message)}}}

function wrFiscalEsc(v){
  return esc(v==null?'':String(v));
}
function wrFiscalMoney(v){
  return money(Number(v||0));
}
function wrFiscalData(o,itens){
  const cliente = o.clientes || o.cliente || {};
  const cpf = cliente.cpf_cnpj || cliente.cpf || cliente.cnpj || '';
  const servicos = (itens||[]).filter(x=>x.tipo==='Serviço').map(x=>x.nome||'Serviço');
  const pecas = (itens||[]).filter(x=>x.tipo==='Peça').map(x=>x.nome||'Peça');
  return {
    tipo: servicos.length && pecas.length ? 'NFS-e + NFC-e/NF-e' : (servicos.length ? 'NFS-e (serviços)' : 'NFC-e/NF-e (mercadorias)'),
    cliente: cliente.nome || '',
    documento: cpf,
    total: Number(o.total||0),
    numero: o.nota_fiscal_numero || '',
    chave: o.nota_fiscal_chave || '',
    status: o.nota_fiscal_status || 'Não emitida',
    servicos: servicos.join(', '),
    pecas: pecas.join(', ')
  };
}

      '<div class="wr-fiscal-item"><div class="wr-fiscal-label">Cliente</div><div class="wr-fiscal-value">'+wrFiscalEsc(f.cliente)+'</div></div>'+
      '<div class="wr-fiscal-item"><div class="wr-fiscal-label">CPF/CNPJ</div><div class="wr-fiscal-value">'+wrFiscalEsc(f.documento||'Não informado')+'</div></div>'+
      '<div class="wr-fiscal-item"><div class="wr-fiscal-label">Serviços</div><div class="wr-fiscal-value">'+wrFiscalEsc(f.servicos||'Nenhum')+'</div></div>'+

async function wrFiscalWhatsApp(id){
  try{
    const q=await sb.from('ordens_servico').select('*, clientes(nome,telefone), veiculos(marca,modelo,placa)').eq('id',id).single();
    if(q.error) throw q.error;
    const o=q.data||{}, phone=String(o.clientes?.telefone||'').replace(/\D/g,'');
    if(!phone) return alert('Este cliente não possui telefone cadastrado.');
    let p=phone; if(p.length<=11)p='55'+p;
    const msg='WR Garagem\\nOS '+(o.numero||'')+'\\nCliente: '+(o.clientes?.nome||'')+'\\nVeículo: '+[o.veiculos?.marca,o.veiculos?.modelo,o.veiculos?.placa].filter(Boolean).join(' ')+'\\nTotal: '+money(o.total);
    window.open('https://wa.me/'+p+'?text='+encodeURIComponent(msg),'_blank');
  }catch(e){alert('Não foi possível preparar o WhatsApp: '+e.message)}
}

async function viewOS(id){
  let o=data.ordens.find(x=>x.id===id);
  if(!o){
    try{
      let q=await sb.from('ordens_servico').select('*, clientes(nome,telefone), veiculos(marca,modelo,ano,placa,km)').eq('id',id).single();
      if(q.error)throw q.error;
      o=q.data;
    }catch(e){return toast('Erro ao abrir OS: '+e.message)}
  }
  let [pr,sr]=await Promise.all([
    sb.from('os_pecas').select('quantidade,preco_unitario,desconto,pecas(nome)').eq('os_id',id),
    sb.from('os_servicos').select('quantidade,preco_unitario,desconto,servicos(nome)').eq('os_id',id)
  ]);
  if(pr.error||sr.error)return toast('Erro ao carregar itens da OS.');
  let itens=[

    ...(sr.data||[]).map(x=>({tipo:'Serviço',nome:x.servicos?.nome||'Serviço',qtd:Number(x.quantidade||0),valor:Number(x.preco_unitario||0)}))

    '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">'+

    '</div>'+
    '<div class="panel">'+
      '<div class="grid2">'+
        '<div><b>Cliente</b><br>'+esc(cliente.nome||'')+'</div>'+
        '<div><b>Telefone</b><br>'+esc(cliente.telefone||'')+'</div>'+
        '<div><b>Veículo</b><br>'+esc([veiculo.marca,veiculo.modelo,veiculo.ano].filter(Boolean).join(' '))+'</div>'+
        '<div><b>Placa</b><br>'+esc(veiculo.placa||'')+'</div>'+
        '<div><b>KM de entrada</b><br>'+esc(o.km_entrada||'')+'</div>'+
        '<div><b>Total</b><br>'+money(total)+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="panel">'+
      '<h3>Serviços e peças</h3>'+
      '<div class="tablewrap"><table id="osItemsTable"><tr><th>Tipo</th><th>Item</th><th>Qtd.</th><th>Valor unit.</th><th>Total</th></tr>'+
      itens.map(x=>'<tr><td>'+esc(x.tipo)+'</td><td>'+esc(x.nome)+'</td><td>'+esc(x.qtd)+'</td><td>'+money(x.valor)+'</td><td>'+money(x.qtd*x.valor)+'</td></tr>').join('')+
      '</table></div>'+
      '<div style="text-align:right;margin-top:10px"><b>TOTAL: '+money(total)+'</b></div>'+
    '</div>'+
    '<div class="panel">'+
      '<h3>Status e pagamento</h3>'+
      '<div class="grid2">'+
        '<div><label>Status</label><select id="viewStatus"><option value="Orçamento">Orçamento</option><option value="Aprovada">Aprovada</option><option value="Em andamento">Em andamento</option><option value="Pronta">Pronta</option><option value="Entregue">Entregue</option><option value="Cancelada">Cancelada</option></select></div>'+
        '<div><label>Previsão de entrega</label><input id="viewEntrega" type="date" value="'+esc(o.previsao_entrega||'')+'"></div>'+
        '<div><label>Forma de pagamento</label><input id="viewPag" value="'+esc(o.forma_pagamento||'')+'"></div>'+
        '<div><label>Status pagamento</label><select id="viewPagStatus"><option value="Em aberto">Em aberto</option><option value="Pago">Pago</option><option value="Parcial">Parcial</option></select></div>'+
        '<div><label>Valor pago</label><input id="viewPago" type="number" step="0.01" value="'+esc(o.valor_pago||0)+'"></div>'+
        '<div><label>Vencimento</label><input id="viewVenc" type="date" value="'+esc(o.vencimento||'')+'"></div>'+
      '</div>'+
      '<div style="margin-top:12px"><button type="button" class="primary" onclick="updateOSStatus(\''+esc(o.id)+'\')">Salvar atualização</button></div>'+
    '</div>'+
    '<div class="panel">'+
      '<h3>Diagnóstico / recomendações</h3><p>'+esc(o.diagnostico||'Nenhuma informação registrada.')+'</p>'+
      '<h3>Observações</h3><p>'+esc(o.observacoes||'Nenhuma observação registrada.')+'</p>'+
    '</div>'+
    '<div class="panel">'+
      '<h3>📸 Fotos do serviço</h3><div id="photosPanel"></div>'+
    '</div>'+
    renderFiscalCard(o,itens);

  if($('viewStatus'))$('viewStatus').value=o.status||'Orçamento';
  if($('viewPagStatus'))$('viewPagStatus').value=o.status_pagamento||'Em aberto';
  await renderPhotos(o.id);
}
function sendWhatsAppOS(id){let o=null;fetchOSForWhatsApp(id)}
async function fetchOSForWhatsApp(id){try{let q=await sb.from('ordens_servico').select('*, clientes(nome,telefone), veiculos(marca,modelo,ano,placa,km)').eq('id',id).single();if(q.error)throw q.error;let o=q.data,phone=String(o.clientes?.telefone||'').replace(/\D/g,'');if(!phone)return alert('Este cliente não possui telefone cadastrado.');if(phone.length<=11)phone='55'+phone;let [pr,sr]=await Promise.all([sb.from('os_pecas').select('quantidade,preco_unitario,pecas(nome)').eq('os_id',id),sb.from('os_servicos').select('quantidade,preco_unitario,servicos(nome)').eq('os_id',id)]);if(pr.error)throw pr.error;if(sr.error)throw sr.error;let linhas=[];(pr.data||[]).forEach(x=>linhas.push(`• Peça: ${x.pecas?.nome||'Item'} — ${x.quantidade} x ${money(x.preco_unitario)} = ${money(Number(x.quantidade||0)*Number(x.preco_unitario||0))}`));(sr.data||[]).forEach(x=>linhas.push(`• Serviço: ${x.servicos?.nome||'Serviço'} — ${x.quantidade} x ${money(x.preco_unitario)} = ${money(Number(x.quantidade||0)*Number(x.preco_unitario||0))}`));let msg=`Olá, ${o.clientes?.nome||''}!\n\n*WR GARAGEM*\n*ORDEM DE SERVIÇO ${osLabel(o.numero)}*\n\n*Veículo:* ${[o.veiculos?.marca,o.veiculos?.modelo,o.veiculos?.ano].filter(Boolean).join(' ')}\n*Placa:* ${o.veiculos?.placa||''}${o.veiculos?.km?`\n*KM:* ${o.veiculos.km}`:''}\n*Status:* ${o.status||''}${o.previsao_entrega?`\n*Previsão de entrega:* ${o.previsao_entrega}`:''}\n\n*Itens:*\n${linhas.length?linhas.join('\n'):'Nenhum item informado.'}\n\n*Desconto:* ${money(o.desconto||0)}\n*TOTAL: ${money(o.total||0)}*\n\nEstamos à disposição. Obrigado pela preferência!`;let url=`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;window.location.href=url}catch(e){toast('Erro ao preparar WhatsApp: '+e.message)}}
function printOS(){
  document.body.classList.toggle('printingNewOS', !!$('printArea'));
  /* Na tela de uma OS já salva, o conteúdo de impressão já está renderizado.
     Não tente montar #printArea (ele não existe nessa tela); apenas abra a impressão. */
  if(!$('printArea')){ window.print(); return; }
  const c=data.clientes.find(x=>x.id===$('oc')?.value), v=data.veiculos.find(x=>x.id===$('ov')?.value), z=calc();
  const pe=itemsP.map(x=>{let r=data.pecas.find(p=>p.id===x.ref);return {nome:r?.nome||'',qtd:x.qtd,valor:x.valor,total:x.qtd*x.valor}});
  const se=itemsS.map(x=>{let r=data.servicos.find(q=>q.id===x.ref);return {nome:r?.nome||'',qtd:x.qtd,valor:x.valor,total:x.qtd*x.valor}});
  const rows=[...pe.map(x=>`<tr><td>Peça</td><td>${esc(x.nome)}</td><td>${x.qtd}</td><td>${money(x.valor)}</td><td>${money(x.total)}</td></tr>`),...se.map(x=>`<tr><td>Serviço</td><td>${esc(x.nome)}</td><td>${x.qtd}</td><td>${money(x.valor)}</td><td>${money(x.total)}</td></tr>`)];
  $('printArea').innerHTML=`<div class="printHeader"><img src="logo-wr-garagem.png" class="osLogo" alt="WR Garagem"><div><h1>WR Garagem</h1><small>Manutenção • Confiança • Performance</small></div></div><h2>Ordem de Serviço</h2><div class="printMeta"><div><b>Cliente:</b> ${esc(c?.nome)}</div><div><b>Telefone:</b> ${esc(c?.telefone)}</div><div><b>Veículo:</b> ${esc([v?.marca,v?.modelo,v?.ano].filter(Boolean).join(' '))}</div><div><b>Placa:</b> ${esc(v?.placa)}</div><div><b>KM:</b> ${esc($('okm')?.value)}</div><div><b>Previsão:</b> ${esc($('oent')?.value)}</div><div><b>Status:</b> ${esc($('ost')?.value)}</div><div><b>Pagamento:</b> ${esc($('opag')?.value)}</div></div><div class="printSection"><h3>Peças e serviços</h3><table class="printTable"><tr><th>Tipo</th><th>Item</th><th>Qtd.</th><th>Valor unit.</th><th>Total</th></tr>${rows.join('')}</table></div><div class="printSection"><h3>Diagnóstico / serviços executados / recomendações</h3><p>${esc($('odiag')?.value||'')}</p><h3>Observações</h3><p>${esc($('oobs')?.value||'')}</p></div><div class="printAreaTotal">Desconto: ${money(z.d)}<br>TOTAL: ${money(z.t)}</div><div class="sigGrid"><div class="sigBox">Assinatura do cliente</div><div class="sigBox">Assinatura do responsável pelo serviço</div></div>`;
  window.print();
  document.body.classList.remove('printingNewOS');
}
