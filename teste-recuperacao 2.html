<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperar senha — WR Garagem</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#080a0c;--panel:#17191b;--line:#35393c;--gold:#d4ad58;--text:#f4f4f4;--muted:#aeb3b7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}h1{font-size:26px;margin:0 0 12px}.muted{color:var(--muted);line-height:1.5}label{display:block;font-weight:600;margin:18px 0 8px}input{width:100%;padding:14px;border-radius:10px;border:1px solid #45494c;background:#0e1012;color:white;font-size:16px}button{margin-top:18px;border:0;border-radius:10px;background:var(--gold);color:#151515;font-weight:700;font-size:16px;padding:14px 18px;width:100%}#status{margin-top:16px;line-height:1.5;overflow-wrap:anywhere}.hidden{display:none}.small{font-size:13px}
</style></head>
<body><main class="card"><h1 id="heading">Recuperar senha</h1><p class="muted" id="intro">Esta página é exclusiva para redefinir a senha do WR Garagem.</p>
<section id="formArea" class="hidden"><label for="pw">Nova senha</label><input id="pw" type="password" autocomplete="new-password" minlength="8" placeholder="Mínimo de 8 caracteres"><label for="pw2">Confirmar nova senha</label><input id="pw2" type="password" autocomplete="new-password" minlength="8" placeholder="Digite novamente"><button id="save">Salvar nova senha</button></section>
<p id="status" role="status">Verificando o link de recuperação…</p><p class="muted small">Não compartilhe o link de recuperação nem códigos de acesso.</p></main>
<script>
(async()=>{
 const $=id=>document.getElementById(id), say=t=>$('status').textContent=t;
 const CONFIG_KEY='wr_garagem_supabase_config_v1';
 let cfg=null; try{cfg=JSON.parse(localStorage.getItem(CONFIG_KEY)||'null')}catch{}
 if(!cfg?.url||!cfg?.key){say('Não encontrei a configuração salva neste navegador. Abra o WR Garagem neste mesmo navegador e configure a conexão Supabase; depois volte ao link de recuperação.');return}
 if(!window.supabase?.createClient){say('Não foi possível carregar a biblioteca de autenticação. Atualize a página e tente novamente.');return}
 const url=new URL(location.href), hash=new URLSearchParams(location.hash.slice(1));
 const error=hash.get('error_description')||hash.get('error'); if(error){say('O link de recuperação foi recusado ou expirou. Solicite um novo link e abra-o uma única vez.');return}
 const client=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
 let session=null;
 const at=hash.get('access_token'),rt=hash.get('refresh_token');
 if(at&&rt){const {data,error}=await client.auth.setSession({access_token:at,refresh_token:rt});if(error){say('Não foi possível validar este link. Solicite um novo e-mail de recuperação.');return}session=data.session}
 else {const {data,error}=await client.auth.getSession();if(error){say('Não foi possível verificar a sessão. Solicite um novo link de recuperação.');return}session=data.session}
 if(!session){say('Não há uma sessão de recuperação válida. Solicite um novo link e abra-o diretamente nesta página.');return}
 // Remove credentials from the address bar after setting the session.
 history.replaceState(null,'',location.pathname+location.search);
 $('heading').textContent='Definir nova senha';$('intro').textContent='Digite a nova senha da sua conta WR Garagem.';$('formArea').classList.remove('hidden');say('Link validado. Defina sua nova senha abaixo.');
 $('save').addEventListener('click',async()=>{const a=$('pw').value,b=$('pw2').value;if(a.length<8){say('Use uma senha com pelo menos 8 caracteres.');return}if(a!==b){say('As senhas não coincidem.');return}$('save').disabled=true;$('save').textContent='Salvando…';const {error}=await client.auth.updateUser({password:a});if(error){say('Não foi possível salvar a senha: '+error.message);$('save').disabled=false;$('save').textContent='Salvar nova senha';return}$('heading').textContent='Senha alterada';$('intro').textContent='Sua senha foi atualizada com sucesso. Volte ao WR Garagem e entre com a nova senha.';$('formArea').classList.add('hidden');say('Concluído. Você já pode entrar com a nova senha.');$('save').disabled=true;});
})().catch(e=>{document.getElementById('status').textContent='Erro ao validar a recuperação. Atualize a página ou solicite um novo link.';console.error(e)});
</script></body></html>
